---
apiVersion: v1
kind: Namespace
metadata:
  name: trace-generator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-generator
  namespace: trace-generator
spec:
  # A single workload, run with multiple replicas. Because the receiver is a
  # DaemonSet, these replicas send their spans to different node-local
  # collectors, which then load balance each trace to a consistent grapher.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: trace-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-generator
    spec:
      containers:
        - name: k6-tracing
          # Grafana's k6 tracing client. Its bundled script continuously emits
          # multi-service traces (shop-backend -> auth-service, article-service
          # -> postgres, ...), which produce service graph edges.
          image: ghcr.io/grafana/xk6-client-tracing:latest
          env:
            - name: ENDPOINT
              value: k8smon-alloy.default.svc.cluster.local:4317
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
