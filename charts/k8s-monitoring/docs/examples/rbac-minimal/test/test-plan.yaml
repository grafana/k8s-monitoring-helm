---
apiVersion: helm-chart-toolbox.grafana.com/v1
kind: TestPlan
name: rbac-minimal

subject:
  releaseName: k8smon
  path: ../../../..
  valuesFile: ../values.yaml

cluster:
  type: kind

dependencies:
  - file: ../../../../tests/integration/rbac-minimal/dependencies/collector-logs.yaml
  - preset: prometheus
  - preset: loki
  - preset: grafana
    overrides:
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              url: http://prometheus-server.prometheus.svc:9090
              isDefault: true
            - name: Loki
              type: loki
              url: http://loki-gateway.loki.svc:8080
              basicAuth: true
              basicAuthUser: loki
              jsonData:
                httpHeaderName1: X-Scope-OrgID
              secureJsonData:
                basicAuthPassword: lokipassword
                httpHeaderValue1: "1"

tests:
  - type: kubernetes-objects-test
    values:
      checks:
        - {kind: ClusterRole, name: k8smon-alloy-metrics-default-rbac}
        - {kind: Role, name: k8smon-alloy-metrics-rbac, namespace: default}
        - {kind: ClusterRole, name: k8smon-alloy-singleton-default-rbac}
        - {kind: ClusterRole, name: k8smon-alloy-logs-default-rbac}
        # The Alloy Operator doesn't create its own RBAC for these collectors.
        - {kind: ClusterRole, name: k8smon-alloy-metrics, expect: {count: 0}}
        - {kind: ClusterRole, name: k8smon-alloy-singleton, expect: {count: 0}}
        - {kind: ClusterRole, name: k8smon-alloy-logs, expect: {count: 0}}

  - type: query-test
    values:
      tests:
        - env:
            CLUSTER: rbac-minimal
            PROMETHEUS_URL: http://prometheus-server.prometheus.svc:9090/api/v1/query
            PROMETHEUS_USER: promuser
            PROMETHEUS_PASS: prometheuspassword
            LOKI_URL: http://loki.loki.svc:3100/loki/api/v1/query
            LOKI_TENANTID: 1
            LOKI_USER: loki
            LOKI_PASS: lokipassword
          queries:
            # Node discovery and nodes/metrics
            - query: kubernetes_build_info{cluster="$CLUSTER", job="integrations/kubernetes/kubelet"}
              type: promql
            - query: machine_memory_bytes{cluster="$CLUSTER", job="integrations/kubernetes/cadvisor"}
              type: promql
            # Endpoints discovery in the release namespace
            - query: kube_node_info{cluster="$CLUSTER", job="integrations/kubernetes/kube-state-metrics"}
              type: promql
            # Pod discovery in the release namespace
            - query: node_exporter_build_info{cluster="$CLUSTER", job="integrations/node_exporter"}
              type: promql
            # Events
            - query: count_over_time({cluster="$CLUSTER", job="integrations/kubernetes/eventhandler"}[1h])
              type: logql
            # Pod discovery for logs
            - query: count_over_time({cluster="$CLUSTER", namespace="default"}[1h])
              type: logql
            # Forbidden scrapes are only logged at debug level, so check that every target is up
            - query: up{cluster="$CLUSTER"} == 0
              type: promql
              expect:
                count: 0

        # Runs after the queries above pass, so every collector has already called the Kubernetes API.
        - env:
            LOKI_URL: http://loki.loki.svc:3100/loki/api/v1/query_range
            LOKI_TENANTID: 1
            LOKI_USER: loki
            LOKI_PASS: lokipassword
          queries:
            # Every collector's logs arrive, so the empty result below means no errors rather than no logs
            - query: sum by (instance) (count_over_time({job="collector-logs"}[1h]))
              type: logql
              expect:
                count: 3
            - query: '{job="collector-logs"} |~ `(?i)forbidden`'
              type: logql
              expect:
                count: 0
