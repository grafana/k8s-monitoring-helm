---
apiVersion: v1
kind: Pod
metadata:
  name: mssql-workload
  namespace: mssql
  labels:
    app.kubernetes.io/name: mssql-workload
    app.kubernetes.io/instance: test-database
spec:
  restartPolicy: Always
  containers:
    - name: query-worker
      image: mcr.microsoft.com/mssql/server:2022-latest
      env:
        - name: MSSQL_HOST
          value: test-database-mssql.mssql.svc
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: test-database-mssql
              key: mssql-password
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -C"
          if [ ! -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD="/opt/mssql-tools/bin/sqlcmd"; fi
          echo "Waiting for SQL Server..."
          until $SQLCMD -S "$MSSQL_HOST" -U sa -P "$MSSQL_SA_PASSWORD" -d testdb -Q "SELECT 1" >/dev/null 2>&1; do
            sleep 5
          done
          while true; do
            $SQLCMD -S "$MSSQL_HOST" -U sa -P "$MSSQL_SA_PASSWORD" -d testdb -Q "INSERT INTO dbo.events (message) VALUES (CONCAT('integration-write-', CONVERT(varchar(36), NEWID())));" >/dev/null
            $SQLCMD -S "$MSSQL_HOST" -U sa -P "$MSSQL_SA_PASSWORD" -d testdb -Q "SELECT COUNT(*) AS records FROM dbo.events;" >/dev/null
            echo "query-worker: inserted and queried rows in testdb.dbo.events"
            sleep 10
          done
