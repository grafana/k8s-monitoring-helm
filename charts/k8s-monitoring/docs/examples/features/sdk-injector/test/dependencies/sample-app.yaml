---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# A minimal Node.js HTTP server. It carries no instrumentation of its own — the SDK Injector adds it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-node
  namespace: demo
  labels: {app: hello-node}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hello-node}
  template:
    metadata:
      labels: {app: hello-node}
    spec:
      containers:
        - name: hello
          image: node:20-alpine
          command:
            - node
            - -e
            - |
              const http = require('http');
              http.createServer((req, res) => { res.writeHead(200); res.end('hello\n'); })
                .listen(8080, () => console.log('listening on 8080'));
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: hello-node
  namespace: demo
spec:
  selector: {app: hello-node}
  ports:
    - port: 8080
      targetPort: 8080
---
# Generates traffic so the injected SDK produces server spans.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: demo
  labels: {app: traffic}
spec:
  replicas: 1
  selector:
    matchLabels: {app: traffic}
  template:
    metadata:
      labels: {app: traffic}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - while true; do curl -s http://hello-node.demo.svc:8080/ >/dev/null; sleep 2; done
