    } // otelcol.processor.batch "localtempo"
    otelcol.exporter.otlp "localtempo" {
      client {
        endpoint = "tempo.tempo.svc:4317"
        tls {
          insecure = true
          insecure_skip_verify = true
        }
      }
    
