# Self-reporting creates a single metric and log that reports anonymized information about how this Helm chart was
# configured. It reports features enabled, destinations types used, and alloy instances enabled. It does not report any
# actual telemetry data, credentials or configuration, or send any data to any destination other than the ones
# configured above.
# @section -- Features - Self-reporting
selfReporting:
  # -- Enable Self-reporting.
  # @section -- Features - Self-reporting
  enabled: true

  # -- The destinations where self-report metrics will be sent. If empty, all metrics-capable destinations will be used.
  # @section -- Features - Self-reporting
  destinations: []

  # -- Optional chain of processors to run before delivering data to destinations.
  # Each entry is a key from the top-level `dataProcessors:` map.
  # @section -- Features - Self-reporting
  dataProcessors: []

  # -- How frequently to generate self-report metrics. This does utilize the global scrapeInterval setting.
  # @default -- 60s
  # @section -- Features - Self-reporting
  scrapeInterval: ""

#
# Collectors (Alloy instances)
#

# Define collectors.
# @section -- Collectors
collectors: {}

# Collector common affects all collectors
collectorCommon:
  # Apply settings for all Alloy collectors
  # @section -- Collectors
  alloy: {}

#
# Telemetry Services
# This is where additional services can be deployed to the Kubernetes cluster to instrument, generate, or gather
# telemetry data from other workloads on the Kubernetes cluster, or from the cluster itself.
#
telemetryServices:
  # [Kepler](https://sustainable-computing.io/) is a service that can gather energy usage metrics from the Kubernetes
  # Cluster nodes.
  kepler:
    # -- Deploy [Kepler](https://sustainable-computing.io/) to gather energy usage metrics from the Kubernetes Cluster
    # nodes.
    # @section -- Telemetry Services
    deploy: false

  # [kube-state-metrics](https://github.com/kubernetes/kube-state-metrics) exposes Kubernetes object state metrics.
  kube-state-metrics:
    # -- Deploy kube-state-metrics to expose Kubernetes object metadata as Prometheus metrics.
    # @section -- Telemetry Services
    deploy: false

  # [OpenCost](https://www.opencost.io/) reports Kubernetes resource cost data.
  opencost:
    # -- Deploy OpenCost to calculate and expose Kubernetes cost allocation metrics.
    # @section -- Telemetry Services
    deploy: false

  # [Node Exporter](https://github.com/prometheus/node_exporter) collects host-level Linux metrics.
  node-exporter:
    # -- Deploy Node Exporter to gather Linux node hardware and OS metrics.
    # @section -- Telemetry Services
    deploy: false

  # [Windows Exporter](https://github.com/prometheus-community/windows_exporter) collects host-level Windows metrics.
  windows-exporter:
    # -- Deploy Windows Exporter to gather Windows node hardware and OS metrics.
    # @section -- Telemetry Services
    deploy: false

  # [k8s-manifest-tail](https://github.com/grafana/k8s-manifest-tail) watches and logs Kubernetes resource manifest changes.
  k8s-manifest-tail:
    # -- Deploy k8s-manifest-tail to watch and log Kubernetes manifest changes.
    # @section -- Telemetry Services
    deploy: false

  # [Beyla](https://github.com/grafana/beyla) provides a Kubernetes cache that supplies metadata to Beyla instances.
  beyla:
    # -- Deploy Grafana Beyla's Kubernetes cache.
    # @section -- Telemetry Services
    deploy: false

    # Options for the Grafana Beyla Kubernetes metadata cache.
    k8sCache:
      # -- Number of replicas for the Beyla Kubernetes metadata cache. Set to a positive number and set telemetryServices.beyla.deploy=true to deploy the cache.
      # @section -- Telemetry Services
      replicas: 0

  # The [SDK Injector](https://github.com/grafana/k8s-injection-controller) auto-instruments applications with the Beyla SDK.
  sdkInjector:
    # -- Deploy the SDK Injector.
    # @section -- Telemetry Services
    deploy: false

# The Alloy Operator is a Kubernetes Operator that manages Alloy instances and their lifecycle.
# To see all valid settings, please see the [Alloy Operator documentation](https://github.com/grafana/alloy-operator/tree/main/charts/alloy-operator).
alloy-operator:
  # -- Deploy the Alloy Operator.
  # @section -- Alloy Operator
  deploy: true

  # -- Check for another Alloy Operator already running in the cluster that would compete to manage the same Alloy
  # instances.
  # @section -- Alloy Operator
  conflictCheck: true

  waitForAlloyRemoval:
    # -- Run Helm hooks that ensure all Alloy instances are cleaned up before the Alloy Operator is removed. This
    # enables two hooks that share the settings in this section: a post-install/post-upgrade hook that adds a finalizer
    # to the Alloy Operator deployment, and a pre-delete hook that removes Alloy instances and the finalizer during
    # uninstall.
    # @section -- Alloy Operator
    enabled: true

    # -- The image to use for the Alloy removal Helm Hooks (both the post-install/post-upgrade add-finalizer hook and
    # the pre-delete removal hook).
    # @section -- Alloy Operator
    image:
      registry: ghcr.io
      repository: grafana/helm-chart-toolbox-kubectl
      tag: 0.1.2
      digest: ""
      pullPolicy: IfNotPresent
      pullSecrets: []

    # -- Annotations to apply to the Pod for the Alloy removal Helm Hooks (both the post-install/post-upgrade
    # add-finalizer hook and the pre-delete removal hook).
    # @section -- Alloy Operator
    podAnnotations: {}

    # -- Labels to apply to the Pod for the Alloy removal Helm Hooks (both the post-install/post-upgrade add-finalizer
    # hook and the pre-delete removal hook).
    # @section -- Alloy Operator
    podLabels:
      sidecar.istio.io/inject: "false"
      linkerd.io/inject: disabled

    # -- Default security context to apply to the container. This can also be set to `null` to remove the security
    # context entirely. Also, `runAsUser` can be set to `null` to remove it.
    # @section -- Alloy Operator
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 4242
      seccompProfile:
        type: RuntimeDefault

    # -- Set the resource field for the Alloy removal Helm Hooks (both the post-install/post-upgrade add-finalizer hook
    # and the pre-delete removal hook).
    # @section -- Alloy Operator
    resources: {}
#      requests:
#       cpu: 10m
#       memory: 64Mi
#
#      limits:
#       cpu: 500m
#       memory: 128Mi

    # -- Tolerations to apply to the Alloy removal Helm Hooks (both the post-install/post-upgrade add-finalizer hook and
    # the pre-delete removal hook).
    # @section -- Alloy Operator
    tolerations: []

    # -- Node selector to use for the Alloy removal Helm Hooks (both the post-install/post-upgrade add-finalizer hook
    # and the pre-delete removal hook).
    # @section -- Alloy Operator
    nodeSelector:
      kubernetes.io/os: linux

# -- *Experimental*: Replace the body of a generated Alloy component with custom content. Each entry must match the
# `type` and `name` of a component that the chart would otherwise render (e.g. `prometheus.relabel "metricsService"`).
# The templated component must end with a `} // <type> "<name>"` close tag for replacement to find it. A replacement
# is applied to every collector whose config contains the component, and the render only fails if no collector
# contains it, so a component that exists on only some collectors is fine. Set `module: <name>` to scope the
# replacement to a component inside a `declare "<module>" { ... }` block. Set `optional: true` to skip a replacement
# that matches no collector instead of failing the render.
# @section -- Configuration Management
replaceComponent: []
# - type: prometheus.relabel
#   name: metrics_service
#   content: |
#     // replacement content for `prometheus.relabel "metrics_service" { ... }`
# - type: discovery.relabel
#   name: default
#   module: cluster_metrics
#   content: |
#     // replacement content for `discovery.relabel "default" { ... }` inside of `declare "cluster_metrics" { ... }`
# - type: discovery.ec2
#   name: ec2_nodes
#   optional: true
#   content: |
#     // only applied when `discovery.ec2 "ec2_nodes" { ... }` is present in the rendered config

# -- Deploy additional manifest objects
# @section -- Extra Objects
extraObjects: []
# - apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: prometheus-secret
#   spec:
#     refreshInterval: 1h
#     secretStoreRef:
#       kind: SecretStore
#       name: example
#     target:
#       template:
#         data:
#           prometheus_host: "{{ .Values.externalServices.prometheus.host }}"
#           username: "{{`{{ .username }}`}}"
#           password: "{{`{{ .password }}`}}"
#     dataFrom:
#     - extract:
#         key: mysecret

#
# Config Validator
#

# The Config Validator runs a pre-install/pre-upgrade Helm hook that validates the generated Alloy config for each
# enabled collector via `alloy fmt` and `alloy run`. The install or upgrade is aborted on any syntax or load error,
# preventing a broken config from reaching the cluster.
configValidator:
  # -- Run the pre-install/pre-upgrade Alloy config validator.
  # @section -- Config Validator
  # TEMPORARY: enabled by default to exercise the validator across all integration tests. Revert to false before merge.
  enabled: true

  # -- The image used to validate the generated Alloy config. Each field is optional; when empty it falls back to the
  # per-collector Alloy image, and finally to the Alloy version pinned by this chart's Alloy Operator.
  # @section -- Config Validator
  image:
    # -- Config validator image registry. When empty, uses `global.image.registry`, then the collector's Alloy registry.
    registry: ""
    # -- Config validator image repository. When empty, uses the collector's Alloy image repository (`grafana/alloy`).
    repository: ""
    # -- (string) Config validator image tag. When empty, uses the collector's Alloy image tag, then the Alloy version
    # pinned by this chart.
    tag: ""
    # -- Config validator image digest. When set, takes precedence over the tag.
    digest: ""
    # -- Config validator image pull policy.
    pullPolicy: IfNotPresent
    # -- Config validator image pull secrets. When empty, uses `global.image.pullSecrets`, then the collector's.
    pullSecrets: []

  # -- ServiceAccount the validator pod runs as. When empty, the namespace default ServiceAccount is used.
  # @section -- Config Validator
  serviceAccount:
    name: ""

  # -- Extra arguments passed to `alloy run` during validation.
  # @section -- Config Validator
  extraArgs: []

  # -- Annotations to apply to the validator pod.
  # @section -- Config Validator
  podAnnotations: {}

  # -- Labels to apply to the validator pod. Service mesh sidecar injection is disabled by default so the short-lived
  # hook pod can run to completion.
  # @section -- Config Validator
  podLabels:
    sidecar.istio.io/inject: "false"
    linkerd.io/inject: disabled

  # -- Security context to apply to the validator container. This can also be set to `null` to remove it entirely, and
  # `runAsUser` can be set to `null` to remove just that field. When running as non-root, keep `readOnlyRootFilesystem`
  # working by leaving the validator's storage path on the writable `emptyDir` this hook mounts.
  # @section -- Config Validator
  securityContext: {}
  #  allowPrivilegeEscalation: false
  #  capabilities:
  #    drop: ["ALL"]
  #  readOnlyRootFilesystem: true
  #  runAsNonRoot: true
  #  runAsUser: 473
  #  seccompProfile:
  #    type: RuntimeDefault

  # -- Resources for the validator pod.
  # @section -- Config Validator
  resources: {}

  # -- Node selector applied to the validator pod.
  # @section -- Config Validator
  nodeSelector: {}

  # -- Tolerations applied to the validator pod.
  # @section -- Config Validator
  tolerations: []

  # -- Extra labels added to both the validator pod and its ConfigMap.
  # @section -- Config Validator
  extraLabels: {}

  # -- Extra annotations added to both the validator pod and its ConfigMap.
  # @section -- Config Validator
  extraAnnotations: {}
