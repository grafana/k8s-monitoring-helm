{{- if .Values.configValidator.enabled }}
{{- $cv := .Values.configValidator }}
{{- range $collectorName := include "collectors.list.enabled" $ | fromYamlArray }}
{{- $values := dict "Values" $.Values "Chart" $.Chart "Files" $.Files "Release" $.Release "Subcharts" $.Subcharts "Template" $.Template "Capabilities" $.Capabilities "collectorName" $collectorName }}
{{- $collectorValues := include "collector.alloy.valuesWithUpstream" $values | fromYaml }}
{{- $alloyConfig := include "collector.alloy.config" $values }}
{{- /* Apply replaceComponent substitutions and trim trailing whitespace exactly as alloy-config.yaml does,
       so the validated config matches the deployed config. Usage tracking is only needed for the
       "unused replacement" validation in alloy-config.yaml, so it is omitted here. */}}
{{- range $replacement := $.Values.replaceComponent }}
  {{- $alloyConfig = include "replaceComponent.apply" (dict "config" $alloyConfig "replacement" $replacement) }}
{{- end }}
{{- $alloyConfig = regexReplaceAll `[ \t]+(\r?\n)` $alloyConfig "\n" }}
{{- $name := printf "%s-validate" (include "collector.alloy.fullname" $values) | trunc 63 | trimSuffix "-" }}
{{- /* Image resolution: an explicit configValidator.image field wins, then the per-collector Alloy image, then the
       Alloy version pinned by this chart's Alloy Operator. global.image.registry/pullSecrets keep top precedence. */}}
{{- $registry := coalesce (dig "image" "registry" "" $.Values.global) $cv.image.registry $collectorValues.image.registry }}
{{- $repo := $cv.image.repository | default $collectorValues.image.repository }}
{{- $digest := $cv.image.digest | default $collectorValues.image.digest }}
{{- $tag := $cv.image.tag | default $collectorValues.image.tag }}
{{- $imageRef := "" }}
{{- if $digest }}
  {{- $imageRef = printf "%s/%s@%s" $registry $repo $digest }}
{{- else if $tag }}
  {{- $imageRef = printf "%s/%s:%s" $registry $repo $tag }}
{{- else }}
  {{- $imageRef = printf "%s/%s:%s" $registry $repo (include "collector.alloy.pinnedImageTag" $) }}
{{- end }}
{{- $pullPolicy := (dig "image" "pullPolicy" "" $.Values.global) | default $cv.image.pullPolicy }}
{{- $pullSecrets := coalesce (dig "image" "pullSecrets" list $.Values.global) $cv.image.pullSecrets $collectorValues.image.pullSecrets }}
{{- $stability := dig "alloy" "stabilityLevel" "generally-available" $collectorValues }}
{{- /* Honor `runAsUser: null` as a request to drop the field entirely (Helm would otherwise render it as null). */}}
{{- $securityContext := $cv.securityContext }}
{{- if $securityContext }}
  {{- if eq (dig "runAsUser" "unset" $securityContext) nil }}
    {{- $securityContext = unset (deepCopy $securityContext) "runAsUser" }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "helper.namespace" $ }}
  labels:
    helm.sh/chart: {{ include "helper.chart" $ }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- range $k, $v := $cv.extraLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- range $k, $v := $cv.extraAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
data:
  config.alloy: |{{ $alloyConfig | trim | nindent 4 }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "helper.namespace" $ }}
  labels:
    helm.sh/chart: {{ include "helper.chart" $ }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    {{- range $k, $v := $cv.extraLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- range $k, $v := $cv.podLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- range $k, $v := $cv.extraAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- range $k, $v := $cv.podAnnotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  restartPolicy: Never
  {{- with $cv.serviceAccount.name }}
  serviceAccountName: {{ . }}
  {{- end }}
  {{- with $cv.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $cv.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $pullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: alloy
      image: {{ $imageRef | quote }}
      {{- with $pullPolicy }}
      imagePullPolicy: {{ . }}
      {{- end }}
      command:
        - bash
        - -c
        - |
          echo "Validating Grafana Alloy config for collector {{ $collectorName }}"
          if ! alloy fmt /etc/alloy/config.alloy > /dev/null; then
            exit 1
          fi
          output=$(alloy run --stability.level {{ $stability }} --storage.path=/tmp/alloy {{ join " " $cv.extraArgs }} "/etc/alloy/config.alloy" 2>&1)
          if ! echo "${output}" | grep "KUBERNETES_SERVICE_HOST and KUBERNETES_SERVICE_PORT must be defined" >/dev/null; then
            echo "${output}"
            exit 1
          fi
          echo "Grafana Alloy config file is valid"
      env:
        - name: KUBERNETES_SERVICE_HOST  # Intentionally blanked to make Alloy fail in a known way
          value: ""
        - name: KUBERNETES_SERVICE_PORT  # Intentionally blanked to make Alloy fail in a known way
          value: ""
      {{- with $securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cv.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumeMounts:
        - name: config
          mountPath: /etc/alloy
        - name: alloy-storage
          mountPath: /tmp/alloy
  volumes:
    - name: config
      configMap:
        name: {{ $name | quote }}
    - name: alloy-storage
      emptyDir: {}
{{- end }}
{{- end }}
