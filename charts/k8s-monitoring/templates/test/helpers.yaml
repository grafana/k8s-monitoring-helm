{{- if eq (((index .Values "testing") | default false) | toString) "true" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-helpers-kubernetes-name
data:
  regular: {{ include "helper.kubernetesName" "valid-kubernetes-name" | quote }}
  nameWithSpacesAndCapitals: {{ include "helper.kubernetesName" "This is my name" | quote }}
  nameWithUnderscores: {{ include "helper.kubernetesName" "i_am_a_snake" | quote }}
  namespace: {{ include "helper.namespace" . | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-collectors-set-extra-env
data:
  insertNew: {{ include "collectors.set_extra_env" (dict "envList" (list (dict "name" "PORT" "value" "8080")) "name" "HOST" "value" "localhost" "overwrite" false) | fromYamlArray | toJson | quote }}
  overwriteExisting: {{ include "collectors.set_extra_env" (dict "envList" (list (dict "name" "PORT" "value" "8080")) "name" "PORT" "value" "9090" "overwrite" true) | fromYamlArray | toJson | quote }}
  noOverwriteExisting: {{ include "collectors.set_extra_env" (dict "envList" (list (dict "name" "PORT" "value" "8080")) "name" "PORT" "value" "9090" "overwrite" false) | fromYamlArray | toJson | quote }}
  insertIntoEmpty: {{ include "collectors.set_extra_env" (dict "envList" (list) "name" "PORT" "value" "8080" "overwrite" false) | fromYamlArray | toJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-destinations-get-enabled
data:
  {{- $destinations := dict "enabledDest" (dict "type" "prometheus") "disabledDest" (dict "type" "prometheus" "disabled" true) }}
  enabledNames: {{ include "destinations.getEnabled" $destinations | fromYaml | keys | sortAlpha | toJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-collectors-features-and-destinations
data:
  {{- $metrics := dict "Values" .Values "Files" .Files "Subcharts" .Subcharts "Release" .Release "Chart" .Chart "collectorName" "alloy-metrics" }}
  {{- $logs := dict "Values" .Values "Files" .Files "Subcharts" .Subcharts "Release" .Release "Chart" .Chart "collectorName" "alloy-logs" }}
  metricsFeatures: {{ include "collectors.features" $metrics | fromYamlArray | toJson | quote }}
  logsFeatures: {{ include "collectors.features" $logs | fromYamlArray | toJson | quote }}
  metricsDestinations: {{ include "collectors.destinationNames" $metrics | fromYamlArray | toJson | quote }}
  logsDestinations: {{ include "collectors.destinationNames" $logs | fromYamlArray | toJson | quote }}
  logsDestinationsWithoutFeatures: {{ include "collectors.destinationNames" (merge (dict "featureKeys" (list)) $logs) | fromYamlArray | toJson | quote }}
{{- end }}
