{{- range $collectorName := include "collectors.list.enabled" . | fromYamlArray }}
{{- include "crdValidation" $ }}
{{- $values := dict "Values" $.Values "Files" $.Files "Release" $.Release "collectorName" $collectorName }}
{{- $alloyValues := (include "collector.alloy.values" $values | fromYaml) | merge (dict "nameOverride" ($collectorName | lower)) }}
{{- $alloySpec := include "collector.alloy.valuesToSpec" $alloyValues }}
---
apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: {{ include "collector.alloy.fullname" $values }}
  namespace: {{ include "helper.namespace" $ }}
  annotations:
    helm.sdk.operatorframework.io/uninstall-wait: "true"
  {{- with $alloyValues.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $labels := $alloyValues.labels | default dict }}
  {{- if dig "fleetManagement" "enabled" false (index $.Values "alloy-operator") }}
    {{- $labels = merge (dict "fleet.grafana.com/collector" $collectorName "fleet.grafana.com/release" $.Release.Name) $labels }}
  {{- end }}
  {{- with $labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:{{ $alloySpec | trim | nindent 2 }}
{{- end }}
