{{- /* Fleet Management connection for the Alloy Operator, from alloy-operator.fleetManagement. It holds the credentials, or points at your Secret with secret.create: false. */}}
{{- $operator := index .Values "alloy-operator" }}
{{- if and $operator.deploy (dig "fleetManagement" "enabled" false $operator) }}
  {{- $fleetManagement := $operator.fleetManagement }}
  {{- $subchart := index .Subcharts "alloy-operator" }}
  {{- $namespace := include "alloy-operator.namespace" $subchart }}
  {{- $name := "alloy-operator-fleet-management" }}
  {{- $createSecret := dig "secret" "create" true $fleetManagement }}
  {{- $credentialsSecret := "" }}
  {{- if $createSecret }}
    {{- if or (not (dig "auth" "username" "" $fleetManagement)) (not (dig "auth" "password" "" $fleetManagement)) }}
      {{- fail "alloy-operator.fleetManagement.enabled needs alloy-operator.fleetManagement.auth.username and auth.password, or secret.create: false and secret.name to read them from your Secret." }}
    {{- end }}
  {{- else }}
    {{- $credentialsSecret = dig "secret" "name" "" $fleetManagement }}
    {{- if not $credentialsSecret }}
      {{- fail "alloy-operator.fleetManagement.secret.create: false needs alloy-operator.fleetManagement.secret.name, a Secret in the Alloy Operator's namespace." }}
    {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
type: Opaque
{{- /* data, not stringData, so a helm upgrade removes the keys a previous install set. */}}
data:
  url: {{ required "alloy-operator.fleetManagement.url is required for alloy-operator.fleetManagement" $fleetManagement.url | b64enc | quote }}
  cluster: {{ required "cluster.name is required for alloy-operator.fleetManagement" .Values.cluster.name | b64enc | quote }}
  {{- if $createSecret }}
  username: {{ $fleetManagement.auth.username | toString | b64enc | quote }}
  password: {{ $fleetManagement.auth.password | toString | b64enc | quote }}
  {{- else }}
  credentialsSecret: {{ $credentialsSecret | b64enc | quote }}
  usernameKey: {{ dig "auth" "usernameKey" "username" $fleetManagement | b64enc | quote }}
  passwordKey: {{ dig "auth" "passwordKey" "password" $fleetManagement | b64enc | quote }}
  {{- end }}
  {{- if dig "rbac" "create" true $operator }}
    {{- $roleName := printf "%s-fleet-management" (include "alloy-operator.fullname" $subchart) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ list $name $credentialsSecret | compact | toJson }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "alloy-operator.serviceAccountName" $subchart }}
    namespace: {{ $namespace }}
  {{- end }}
{{- end }}
