---
# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Feature - Extra Receiver Service
templates:
  - receiver-service.yaml
tests:
  - it: does not create a Service by default
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a Service when enabled
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
          extraService:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-alloy

  - it: creates a Service with a specified name
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
          extraService:
            enabled: true
            name: alloy-ingester
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-alloy-ingester

  - it: creates a Service with a specified full name
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
          extraService:
            enabled: true
            fullname: alloy-ingester
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: alloy-ingester

  - it: has the same extraPorts as the main receiver
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
          extraService:
            enabled: true
          alloy:
            extraPorts:
              - name: otlp-http
                port: 4318
                targetPort: 4318
                protocol: TCP
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
                protocol: TCP
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: spec.ports
          value:
            - name: http-metrics
              port: 12345
              targetPort: 12345
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP

  - it: propagates appProtocol from extraPorts to the Service
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
          extraService:
            enabled: true
          alloy:
            extraPorts:
              - name: otlp-http
                port: 4318
                targetPort: 4318
                protocol: TCP
                appProtocol: http
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
                protocol: TCP
                appProtocol: grpc
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: spec.ports
          value:
            - name: http-metrics
              port: 12345
              targetPort: 12345
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
              appProtocol: http
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
              appProtocol: grpc

  - it: inherits externalTrafficPolicy from the collector's service
    capabilities:
      majorVersion: 1
      minorVersion: 26
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
          extraService:
            enabled: true
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.externalTrafficPolicy
          value: Local

  - it: does not set externalTrafficPolicy for a ClusterIP Service
    capabilities:
      majorVersion: 1
      minorVersion: 26
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
          extraService:
            enabled: true
          service:
            externalTrafficPolicy: Local
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.externalTrafficPolicy

  - it: inherits trafficDistribution from the collector's service
    capabilities:
      majorVersion: 1
      minorVersion: 34
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
          extraService:
            enabled: true
          service:
            trafficDistribution: PreferSameZone
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.trafficDistribution
          value: PreferSameZone

  - it: does not set trafficDistribution before Kubernetes 1.34
    capabilities:
      majorVersion: 1
      minorVersion: 33
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
          extraService:
            enabled: true
          service:
            trafficDistribution: PreferSameZone
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.trafficDistribution

  - it: sets the nodePort of extraPorts for a NodePort Service
    capabilities:
      majorVersion: 1
      minorVersion: 26
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
          extraService:
            enabled: true
          service:
            type: NodePort
          alloy:
            extraPorts:
              - name: tcp-ingest
                port: 1515
                targetPort: 1515
                nodePort: 31515
                protocol: TCP
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ports
          value:
            - name: http-metrics
              nodePort: 31128
              port: 12345
              targetPort: 12345
              protocol: TCP
            - name: tcp-ingest
              nodePort: 31515
              port: 1515
              targetPort: 1515
              protocol: TCP
      - equal:
          path: spec.externalTrafficPolicy
          value: Cluster

  - it: has the right selectors
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-receiver:
          extraConfig: " "
          extraService:
            enabled: true
            fullname: alloy-ingester
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME-alloy-receiver
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: alloy-receiver
