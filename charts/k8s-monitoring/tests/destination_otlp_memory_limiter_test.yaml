# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Destinations - OTLP - Memory limiter
templates:
  - alloy-config.yaml
tests:
  - it: uses the default percentage limits when no fixed limit is set
    set:
      cluster: {name: test-cluster}
      collectors: {alloy-singleton: {extraConfig: " ", includeDestinations: ["test"]}}
      selfReporting: {enabled: false}
      destinations:
        test:
          type: otlp
          url: https://otlp.example.com
          processors:
            memoryLimiter:
              enabled: true
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'otelcol.processor.memory_limiter "test" \{\n\s+check_interval = "1s"\n\s+limit_percentage = 80\n\s+spike_limit_percentage = 20\n'

  - it: uses a fixed limit instead of the percentage limits when set
    set:
      cluster: {name: test-cluster}
      collectors: {alloy-singleton: {extraConfig: " ", includeDestinations: ["test"]}}
      selfReporting: {enabled: false}
      destinations:
        test:
          type: otlp
          url: https://otlp.example.com
          processors:
            memoryLimiter:
              enabled: true
              limit: 512MiB
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'otelcol.processor.memory_limiter "test" \{\n\s+check_interval = "1s"\n\s+limit = "512MiB"\n'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'limit_percentage'

  - it: fails when the limit percentage is over 100
    set:
      cluster: {name: test-cluster}
      collectors: {alloy-singleton: {extraConfig: " ", includeDestinations: ["test"]}}
      selfReporting: {enabled: false}
      destinations:
        test:
          type: otlp
          url: https://otlp.example.com
          processors:
            memoryLimiter:
              enabled: true
              limitPercentage: 101
    asserts:
      - failedTemplate:
          errorPattern: Destination "test" has a memory limiter limitPercentage \(101\) that must be between 1 and 100, or a fixed limit must be set.

  - it: fails when the spike limit percentage is not less than the limit percentage
    set:
      cluster: {name: test-cluster}
      collectors: {alloy-singleton: {extraConfig: " ", includeDestinations: ["test"]}}
      selfReporting: {enabled: false}
      destinations:
        test:
          type: otlp
          url: https://otlp.example.com
          processors:
            memoryLimiter:
              enabled: true
              limitPercentage: 50
              spikeLimitPercentage: 60
    asserts:
      - failedTemplate:
          errorPattern: Destination "test" has a memory limiter spikeLimitPercentage \(60\) that must be at least 1 and less than its limitPercentage \(50\).

  - it: fails when the spike limit percentage is zero
    set:
      cluster: {name: test-cluster}
      collectors: {alloy-singleton: {extraConfig: " ", includeDestinations: ["test"]}}
      selfReporting: {enabled: false}
      destinations:
        test:
          type: otlp
          url: https://otlp.example.com
          processors:
            memoryLimiter:
              enabled: true
              spikeLimitPercentage: 0
    asserts:
      - failedTemplate:
          errorPattern: Destination "test" has a memory limiter spikeLimitPercentage \(0\) that must be at least 1 and less than its limitPercentage \(80\).

  - it: fails when neither a fixed limit nor a limit percentage is set
    set:
      cluster: {name: test-cluster}
      collectors: {alloy-singleton: {extraConfig: " ", includeDestinations: ["test"]}}
      selfReporting: {enabled: false}
      destinations:
        test:
          type: otlp
          url: https://otlp.example.com
          processors:
            memoryLimiter:
              enabled: true
              limitPercentage: 0
    asserts:
      - failedTemplate:
          errorPattern: Destination "test" has a memory limiter limitPercentage \(0\) that must be between 1 and 100, or a fixed limit must be set.
