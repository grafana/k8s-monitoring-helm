---
suite: Test Pre-delete hook functionality
templates:
  - templates/hooks/pre-delete_remove-alloy-and-finalizer.yaml
tests:
  - it: should create hook when operator is deployed and readiness is enabled
    set:
      alloy-operator:
        deploy: true
        waitForAlloyRemoval:
          enabled: true
      collectors:
        alloy-metrics:
          extraConfig: " "
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        equal:
          path: spec.backoffLimit
          value: 0
      - documentIndex: 0
        equal:
          path: spec.activeDeadlineSeconds
          value: 180
      - documentIndex: 0
        notExists:
          path: spec.ttlSecondsAfterFinished
      - documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].args[3]
          value: --wait=true
      - documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].args[4]
          value: --timeout=120s
      - documentIndex: 0
        matchSnapshot:
          path: spec

  - it: should use the configured deletion timeout and deadline
    set:
      alloy-operator:
        deploy: true
        waitForAlloyRemoval:
          enabled: true
          timeoutSeconds: 10
      collectors:
        alloy-metrics:
          extraConfig: " "
    asserts:
      - documentIndex: 0
        equal:
          path: spec.activeDeadlineSeconds
          value: 70
      - documentIndex: 0
        equal:
          path: spec.template.spec.initContainers[0].args[4]
          value: --timeout=10s

  - it: should not create hook when operator is not deployed
    set:
      alloy-operator:
        deploy: false
        waitForAlloyRemoval:
          enabled: true
      clusterMetrics:
        enabled: true
      destinations:
        prometheus:
          type: prometheus
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create hook when readiness wait is disabled
    set:
      alloy-operator:
        deploy: true
        waitForAlloyRemoval:
          enabled: false
      clusterMetrics:
        enabled: true
      destinations:
        prometheus:
          type: prometheus
    asserts:
      - hasDocuments:
          count: 0

  - it: should configure resources when provided
    set:
      alloy-operator:
        deploy: true
        waitForAlloyRemoval:
          enabled: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
    asserts:
      - documentIndex: 0
        equal:
          path: "spec.template.spec.containers[0].resources.requests.cpu"
          value: 10m
      - documentIndex: 0
        equal:
          path: "spec.template.spec.containers[0].resources.limits.memory"
          value: 128Mi

  - it: should render when securityContext is null
    set:
      alloy-operator:
        deploy: true
        waitForAlloyRemoval:
          enabled: true
          securityContext: null
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 0
        notExists:
          path: "spec.template.spec.containers[0].securityContext"
