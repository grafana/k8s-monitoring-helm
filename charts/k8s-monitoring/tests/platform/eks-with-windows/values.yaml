---
cluster:
  name: eks-with-windows-test

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-13-prod-us-east-0.grafana.net/api/prom/push
    auth:
      type: basic
      usernameKey: PROMETHEUS_USER
      passwordKey: PROMETHEUS_PASS
    secret:
      create: false
      name: grafana-cloud-credentials
      namespace: default
  grafana-cloud-logs:
    type: loki
    url: https://logs-prod-006.grafana.net/loki/api/v1/push
    auth:
      type: basic
      usernameKey: LOKI_USER
      passwordKey: LOKI_PASS
    secret:
      create: false
      name: grafana-cloud-credentials
      namespace: default

dataProcessors:
  # Copies the EC2 instance `Team` tag onto telemetry, matching each node's `node` label to
  # its instance private DNS name via discovery.ec2.
  ec2-tags:
    type: ec2Enrichment
    region: ap-northeast-2
    tags:
      team: Team

clusterMetrics:
  enabled: true
  collector: alloy
  dataProcessors: [ec2-tags]

hostMetrics:
  enabled: true
  collector: alloy
  linuxHosts:
    enabled: true
  windowsHosts:
    enabled: true

clusterEvents:
  enabled: true
  clustering: true
  collector: alloy

nodeLogs:
  enabled: true
  collector: alloy-logs

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

podLogsViaKubernetesApi:
  enabled: true
  collector: alloy-logs
  nodeSelector:
    kubernetes.io/os: windows

integrations:
  collector: alloy
  alloy:
    instances:
      - name: alloy
        labelSelectors:
          app.kubernetes.io/name: [alloy, alloy-singleton, alloy-logs]

collectors:
  alloy:
    presets: [clustered, statefulset]
    alloy:
      stabilityLevel: experimental  # Required for prometheus.enrich (ec2Enrichment processor)

  alloy-logs:
    presets: [clustered, filesystem-log-reader, daemonset]

  alloy-windows:
    presets: [windows, daemonset]
    includeDestinations: [grafana-cloud-logs]
    extraConfig: |
      loki.source.windowsevent "system" {
        eventlog_name          = "System"
        use_incoming_timestamp = true
        labels                 = { job = "windows-eventlogs", channel = "System" }
        forward_to             = [loki.write.grafana_cloud_logs.receiver]
      }
    
      loki.source.windowsevent "application" {
        eventlog_name = "Application"
        labels        = { job = "windows-eventlogs", channel = "Application" }
        forward_to    = [loki.write.grafana_cloud_logs.receiver]
      }

telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
  windows-exporter:
    deploy: true
