---
cluster:
  name: eks-with-windows-test

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-13-prod-us-east-0.grafana.net/api/prom/push
    auth:
      type: basic
      usernameKey: PROMETHEUS_USER
      passwordKey: PROMETHEUS_PASS
    secret:
      create: false
      name: grafana-cloud-credentials
      namespace: default
  grafana-cloud-logs:
    type: loki
    url: https://logs-prod-006.grafana.net/loki/api/v1/push
    auth:
      type: basic
      usernameKey: LOKI_USER
      passwordKey: LOKI_PASS
    secret:
      create: false
      name: grafana-cloud-credentials
      namespace: default

dataProcessors:
  # Copies the EC2 instance `Team` tag onto telemetry, matching each node's `node` label to
  # its instance private DNS name via discovery.ec2.
  ec2-tags:
    type: ec2Enrichment
    region: ap-northeast-2
    tags:
      team: Team

clusterMetrics:
  enabled: true
  collector: alloy-linux
  dataProcessors: [ec2-tags]

  # On EKS the control plane is managed by AWS, so kube-scheduler and kube-controller-manager have no
  # discoverable Pods. Scrape them from the EKS Control Plane Metrics API instead. This requires
  # Kubernetes 1.28+ and the metrics.eks.amazonaws.com RBAC rule added to the alloy-metrics collector below.
  controlPlane:
    enabled: true
  kubeScheduler:
    discoveryMode: eks-proxy
  kubeControllerManager:
    discoveryMode: eks-proxy

hostMetrics:
  enabled: true
  collector: alloy-linux
  linuxHosts:
    enabled: true
    source: alloy
  windowsHosts:
    enabled: true

clusterEvents:
  enabled: true
  clustering: true
  collector: alloy-linux

nodeLogs:
  enabled: true
  collector: alloy-linux

windowsEventLogs:
  enabled: true
  collector: alloy-windows
  sources:
    - name: application
      eventLogName: Application
      jobLabel: integrations/windows-application-logs
    - name: system
      eventLogName: System
      jobLabel: integrations/windows-system-logs

podLogsViaLoki:
  enabled: true
  collector: alloy-linux

podLogsViaKubernetesApi:
  enabled: true
  collector: alloy-linux
  nodeSelector:
    kubernetes.io/os: windows

integrations:
  collector: alloy-linux
  alloy:
    instances:
      - name: alloy
        labelSelectors:
          app.kubernetes.io/name: [alloy-linux, alloy-windows]

collectors:
  alloy-linux:
    presets: [clustered, linux-host-monitor, filesystem-log-reader, daemonset]
    alloy:
      stabilityLevel: experimental  # Required for prometheus.enrich (ec2Enrichment processor)
    rbac:
      # The chart's default cluster-scoped RBAC rules, plus a rule granting read access to the EKS
      # Control Plane Metrics API so the `eks-proxy` discoveryMode can scrape kube-scheduler and
      # kube-controller-manager. Overriding clusterRules replaces the list, so the defaults are repeated here.
      clusterRules:
        - apiGroups: [""]
          resources: [nodes]
          verbs: [get, list, watch]
        - apiGroups: [""]
          resources: [nodes/pods]
          verbs: [get, list, watch]
        - apiGroups: [""]
          resources: [nodes/metrics]
          verbs: [get, list, watch]
        - nonResourceURLs: [/metrics]
          verbs: [get]
        # EKS Control Plane Metrics API (metrics.eks.amazonaws.com)
        - apiGroups: [metrics.eks.amazonaws.com]
          resources: [ksh/metrics, kcm/metrics]
          verbs: [get]

  alloy-windows:
    # `windows-scrapeable` opens the host firewall so alloy-linux can scrape this collector's metrics over hostNetwork.
    presets: [windows, windows-host-process, windows-scrapeable, daemonset]
    alloy:
      stabilityLevel: experimental  # Required for prometheus.enrich (ec2Enrichment processor)

telemetryServices:
  kube-state-metrics:
    deploy: true
  windows-exporter:
    deploy: true
