---
apiVersion: helm-chart-toolbox.grafana.com/v1
kind: TestPlan
name: eks-with-windows

subject:
  releaseName: k8smon
  path: ../../..
  valuesFile: values.yaml
  set:
    - key: "cluster.name"
      valueFrom: clusterName

cluster:
  type: eks
  configFile: eks-cluster-config.yaml
  appendRandomNumber: true

dependencies:
  - preset: test-parameters
    namespace: toolbox
  - file: grafana-cloud-credentials.yaml

tests:
  - type: query-test
    values:
      tests:
        - env:
            PROMETHEUS_URL: https://prometheus-prod-13-prod-us-east-0.grafana.net/api/prom/api/v1/query
            LOKI_URL: https://logs-prod-006.grafana.net/loki/api/v1/query
          envFrom:
            - secretRef: {name: grafana-cloud-credentials}
            - configMapRef: {name: test-parameters}
          queries:
            # Features
            - query: grafana_kubernetes_monitoring_build_info{cluster="$clusterName", platform="eks"}
              type: promql
            - query: grafana_kubernetes_monitoring_feature_info{cluster="$clusterName", feature="clusterMetrics"}
              type: promql
            - query: grafana_kubernetes_monitoring_feature_info{cluster="$clusterName", feature="clusterEvents"}
              type: promql
            - query: grafana_kubernetes_monitoring_feature_info{cluster="$clusterName", feature="hostMetrics", sources="linuxHosts,windowsHosts"}
              type: promql
            - query: grafana_kubernetes_monitoring_feature_info{cluster="$clusterName", feature="integrations", sources="alloy"}
              type: promql
            - query: grafana_kubernetes_monitoring_feature_info{cluster="$clusterName", feature="nodeLogs"}
              type: promql
            - query: grafana_kubernetes_monitoring_feature_info{cluster="$clusterName", feature="windowsEventLogs"}
              type: promql
            - query: grafana_kubernetes_monitoring_feature_info{cluster="$clusterName", feature="podLogsViaLoki"}
              type: promql
            - query: grafana_kubernetes_monitoring_feature_info{cluster="$clusterName", feature="podLogsViaKubernetesApi"}
              type: promql
            - query: grafana_kubernetes_monitoring_collector_info{cluster="$clusterName", name="alloy-linux", presets="clustered,linux-host-monitor,filesystem-log-reader,daemonset"}
              type: promql
            - query: grafana_kubernetes_monitoring_collector_info{cluster="$clusterName", name="alloy-windows", presets="windows,windows-host-process,daemonset"}
              type: promql

            # Cluster metrics
            # Kubelet
            - query: kubernetes_build_info{cluster="$clusterName", job="integrations/kubernetes/kubelet"}
              type: promql
            # Kubelet Resources
            - query: node_cpu_usage_seconds_total{cluster="$clusterName", job="integrations/kubernetes/resources"}
              type: promql
            # cAdvisor
            - query: machine_memory_bytes{cluster="$clusterName", job="integrations/kubernetes/cadvisor"}
              type: promql
            # kube-state-metrics
            - query: count(kube_node_info{cluster="$clusterName", job="integrations/kubernetes/kube-state-metrics"})
              type: promql
              expect:
                value: 2

            # Cluster events
            - query: count_over_time({cluster="$clusterName", job="integrations/kubernetes/eventhandler"}[1h])
              type: logql

            # Host metrics
            # Single Linux node
            - query: count(sum by (instance) (node_cpu_seconds_total{cluster="$clusterName", job="integrations/node_exporter"}))
              type: promql
              expect:
                operator: ==
                value: 1
            # Single Windows node
            - query: count(windows_os_info{cluster="$clusterName", job="integrations/windows-exporter"})
              type: promql
              expect:
                operator: ==
                value: 1

            # Integrations
            # Alloy metrics
            - query: alloy_build_info{cluster="$clusterName", app="alloy-linux"}
              type: promql
            - query: alloy_build_info{cluster="$clusterName", app="alloy-windows"}
              type: promql

            # Node logs
            - query: count_over_time({cluster="$clusterName", job="integrations/kubernetes/journal"}[1h])
              type: logql

            # Windows Event logs
            - query: count_over_time({cluster="$clusterName", job="integrations/windows-application-logs"}[1h])
              type: logql
            - query: count_over_time({cluster="$clusterName", job="integrations/windows-system-logs"}[1h])
              type: logql

            # Pod logs
            # Logs from the Linux pods (via file system)
            - query: count_over_time({cluster="$clusterName", job="default/alloy-operator"}[1h])
              type: logql
            # Logs from the Windows pods (via API Server)
            - query: count_over_time({cluster="$clusterName", job="integrations/windows_exporter"}[1h])
              type: logql

            # EC2 enrichment: the ec2-tags data processor copies each node's EC2 `Team` tag
            # onto node-labeled metrics. Both EC2 instances are tagged `Team=platform-test`,
            # so both nodes' kube_node_info gain `team="platform-test"`.
            - query: count(kube_node_info{cluster="$clusterName", job="integrations/kubernetes/kube-state-metrics", team="platform-test"})
              type: promql
              expect:
                value: 2

            # DPM check
            - query: avg(count_over_time(scrape_samples_scraped{cluster="$clusterName"}[1m]))
              type: promql
              expect:
                value: 1
                operator: ==
