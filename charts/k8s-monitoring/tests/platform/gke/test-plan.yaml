---
apiVersion: helm-chart-toolbox.grafana.com/v1
kind: TestPlan
name: gke

subject:
  releaseName: k8smon
  path: ../../..
  valuesFile: values.yaml
  set:
    - key: "cluster.name"
      valueFrom: clusterName
    - key: "telemetryServices.opencost.opencost.exporter.defaultClusterId"
      valueFrom: clusterName

cluster:
  type: gke
  zone: us-west1
  args:
    - --num-nodes=1
    - --labels source=k8s-monitoring-helm-platform-test
    # Org policy (compute.vmExternalIpAccess) forbids external node IPs -> private nodes.
    # No public control-plane IP; reached via the IAM-gated DNS endpoint
    # (requires CLOUDSDK_CONTAINER_USE_DNS_ENDPOINT=true in .envrc / CI).
    - --enable-ip-alias
    - --enable-private-nodes
    - --enable-private-endpoint
    - --enable-master-authorized-networks
    - --enable-dns-access
  appendRandomNumber: true

dependencies:
  - preset: test-parameters
    namespace: toolbox
  - file: grafana-cloud-credentials.yaml

tests:
  - type: query-test
    values:
      tests:
        - env:
            PROMETHEUS_URL: https://prometheus-prod-13-prod-us-east-0.grafana.net/api/prom/api/v1/query
            LOKI_URL: https://logs-prod-006.grafana.net/loki/api/v1/query
          envFrom:
            - secretRef: {name: grafana-cloud-credentials}
            - configMapRef: {name: test-parameters}
          queries:
            # Features
            - query: grafana_kubernetes_monitoring_build_info{cluster="$clusterName", platform="gke"}
              type: promql
            - query: grafana_kubernetes_monitoring_feature_info{cluster="$clusterName", feature="clusterMetrics"}
              type: promql
            - query: grafana_kubernetes_monitoring_feature_info{cluster="$clusterName", feature="clusterEvents"}
              type: promql
            - query: grafana_kubernetes_monitoring_feature_info{cluster="$clusterName", feature="podLogsViaLoki"}
              type: promql

            # Cluster metrics
            - query: kubernetes_build_info{cluster="$clusterName", job="integrations/kubernetes/kubelet"}
              type: promql
            - query: node_cpu_usage_seconds_total{cluster="$clusterName", job="integrations/kubernetes/resources"}
              type: promql
            - query: machine_memory_bytes{cluster="$clusterName", job="integrations/kubernetes/cadvisor"}
              type: promql
            - query: kube_node_info{cluster="$clusterName", job="integrations/kubernetes/kube-state-metrics"}
              type: promql
            - query: opencost_build_info{cluster="$clusterName", job="integrations/opencost"}
              type: promql
            - query: container_cpu_allocation{cluster="$clusterName", job="integrations/opencost"}
              type: promql
            - query: container_memory_allocation_bytes{cluster="$clusterName", job="integrations/opencost"}
              type: promql

            # Alloy metrics
            - query: alloy_build_info{cluster="$clusterName", app="alloy-metrics"}
              type: promql
            - query: alloy_build_info{cluster="$clusterName", app="alloy-singleton"}
              type: promql
            - query: alloy_build_info{cluster="$clusterName", app="alloy-logs"}
              type: promql

            # Cluster events
            - query: count_over_time({cluster="$clusterName", job="integrations/kubernetes/eventhandler"}[1h])
              type: logql

            # Pod logs
            - query: count_over_time({cluster="$clusterName", job!="integrations/kubernetes/eventhandler"}[1h])
              type: logql

            # DPM check
            - query: avg(count_over_time(scrape_samples_scraped{cluster="$clusterName"}[1m]))
              type: promql
              expect:
                value: 1
                operator: ==

  - type: metrics-snapshot
    values:
      query: '{__name__=~".+", job="integrations/node_exporter"}'
      env:
        PROMETHEUS_URL: https://prometheus-prod-13-prod-us-east-0.grafana.net/api/prom/api/v1/query
      envFrom:
          - secretRef: {name: grafana-cloud-credentials}
      previousData: |
        query: '{__name__=~".+", job="integrations/node_exporter"}'
        totalMetrics: 69
        totalSeries: 779
        metrics:
          node_cpu_guest_seconds_total: 12
          node_cpu_seconds_total: 48
          node_exporter_build_info: 3
          node_filesystem_avail_bytes: 45
