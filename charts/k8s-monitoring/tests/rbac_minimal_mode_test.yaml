# yamllint disable rule:document-start rule:line-length rule:trailing-spaces rule:braces rule:commas
suite: RBAC - Minimal mode
release:
  name: test
  namespace: monitoring
templates:
  - alloy.yaml
  - alloy-config.yaml
  - sdk-injector-rbac.yaml
  - validations.yaml
set:
  cluster: {name: test-cluster}
  collectors:
    alloy-singleton:
      extraConfig: |-
        loki.source.kubernetes_events "events" {
          forward_to = []
        }
tests:
  - it: leaves the Alloy spec without rbac in alloy mode
    set:
      collectors:
        alloy-singleton: {presets: [singleton]}
    asserts:
      - notExists:
          path: spec.rbac
        template: alloy.yaml
      - hasDocuments:
          count: 1
        template: alloy-config.yaml

  - it: passes the other rbac settings to the Alloy spec in alloy mode
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac:
            mode: alloy
            namespaces: [a]
    asserts:
      - equal:
          path: spec.rbac
          value: {namespaces: [a]}
        template: alloy.yaml

  - it: disables the operator's RBAC and renders its own in minimal mode
    set:
      collectors:
        alloy-singleton: {presets: [singleton], rbac: {mode: minimal}}
    asserts:
      - equal:
          path: spec.rbac
          value: {create: false}
        template: alloy.yaml
      - documentSelector: {path: kind, value: ClusterRole}
        containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: test-alloy-singleton-rbac
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: ClusterRoleBinding}
        containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: test-alloy-singleton-rbac
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [events], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: names, labels, and binds the RBAC objects to the collector's ServiceAccount
    set:
      collectors:
        alloy-singleton: {presets: [singleton], rbac: {mode: minimal}}
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/component: rbac
            app.kubernetes.io/instance: test-alloy-singleton
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/part-of: alloy
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: metadata.annotations
          value:
            k8s.grafana.com/rbac-user-config: loki.source.kubernetes_events from extraConfig (events)
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: ClusterRoleBinding}
        equal:
          path: roleRef
          value: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: test-alloy-singleton-rbac}
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: ClusterRoleBinding}
        equal:
          path: subjects
          value:
            - {kind: ServiceAccount, name: test-alloy-singleton, namespace: monitoring}
        template: alloy-config.yaml

  - it: binds to a named ServiceAccount
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          serviceAccount: {create: false, name: my-sa}
    asserts:
      - documentSelector: {path: kind, value: ClusterRoleBinding}
        equal:
          path: subjects
          value:
            - {kind: ServiceAccount, name: my-sa, namespace: monitoring}
        template: alloy-config.yaml

  - it: applies collectorCommon to every collector
    set:
      collectorCommon:
        alloy:
          rbac: {mode: minimal}
      collectors:
        alloy-singleton: {presets: [singleton]}
    asserts:
      - equal:
          path: spec.rbac
          value: {create: false}
        template: alloy.yaml
      - documentSelector: {path: kind, value: ClusterRole}
        containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: test-alloy-singleton-rbac
        template: alloy-config.yaml

  - it: renders no RBAC with rbac.create false
    set:
      collectors:
        alloy-singleton: {presets: [singleton], rbac: {mode: minimal, create: false}}
    asserts:
      - equal:
          path: spec.rbac
          value: {create: false}
        template: alloy.yaml
      - hasDocuments:
          count: 1
        template: alloy-config.yaml

  - it: keeps alloy mode for collectors with remote configuration
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          remoteConfig:
            enabled: true
            url: https://fleet-management-prod-001.grafana.net
            auth:
              type: basic
              username: 123456
              password: "It's a secret to everyone"
    asserts:
      - notExists:
          path: spec.rbac
        template: alloy.yaml
      - hasDocuments:
          count: 1
        template: alloy-config.yaml

  - it: adds rbac.rules to the ClusterRole and rbac.clusterRules to it as well
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac:
            mode: minimal
            rules:
              - {apiGroups: [""], resources: [configmaps], verbs: [get, list]}
            clusterRules:
              - {nonResourceURLs: [/healthz], verbs: [get]}
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [configmaps], verbs: [get, list]}
            - {apiGroups: [""], resources: [events], verbs: [get, list, watch]}
            - {nonResourceURLs: [/healthz], verbs: [get]}
        template: alloy-config.yaml

  - it: merges verbs from rbac.rules with computed rules for the same resource
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac:
            mode: minimal
            rules:
              - {apiGroups: [""], resources: [events], verbs: [create]}
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [events], verbs: [create, get, list, watch]}
        template: alloy-config.yaml

  - it: puts the rules in Roles and drops cluster-scoped rules with rbac.namespaces
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          extraConfig: |-
            loki.source.kubernetes_events "events" {
              forward_to = []
            }
            discovery.kubernetes "nodes" {
              role = "node"
            }
          rbac:
            mode: minimal
            namespaces: [team-a, team-b]
            rules:
              - {apiGroups: [""], resources: [configmaps], verbs: [get]}
            clusterRules:
              - {nonResourceURLs: [/healthz], verbs: [get]}
    asserts:
      - notExists:
          path: spec.rbac.namespaces
        template: alloy.yaml
      - hasDocuments:
          count: 5
        template: alloy-config.yaml
      - documentSelector:
          path: "$[?(@.kind == 'Role' && @.metadata.namespace == 'team-a')].kind"
          value: Role
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [configmaps], verbs: [get]}
            - {apiGroups: [""], resources: [events], verbs: [get, list, watch]}
        template: alloy-config.yaml
      - documentSelector:
          path: "$[?(@.kind == 'RoleBinding' && @.metadata.namespace == 'team-b')].kind"
          value: RoleBinding
        equal:
          path: roleRef
          value: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: test-alloy-singleton-rbac}
        template: alloy-config.yaml

  - it: fails when no ServiceAccount is created or named
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          serviceAccount: {create: false}
    asserts:
      - failedTemplate:
          errorPattern: 'The alloy-singleton collector uses rbac.mode: minimal, but does not create a ServiceAccount or name one'
        template: validations.yaml

  - it: fails on an unknown mode
    set:
      collectors:
        alloy-singleton: {presets: [singleton], rbac: {mode: tiny}}
    asserts:
      - failedTemplate:
          errorPattern: 'The alloy-singleton collector has an unknown RBAC mode: "tiny"'
        template: validations.yaml

  - it: replaces the SDK Injector shim with a Role for listed ConfigMap writers
    set:
      telemetryServices:
        sdkInjector:
          deploy: true
          allowedConfigMapWriters: system:serviceaccount:$(POD_NAMESPACE):test-alloy-singleton
      collectors:
        alloy-singleton: {presets: [singleton], rbac: {mode: minimal}}
    asserts:
      - hasDocuments:
          count: 0
        template: sdk-injector-rbac.yaml
      - documentSelector:
          path: "$[?(@.kind == 'Role' && @.metadata.namespace == 'monitoring')].kind"
          value: Role
        contains:
          path: rules
          content: {apiGroups: [""], resources: [configmaps], verbs: [create, get, update]}
        template: alloy-config.yaml

  - it: does not grant ConfigMap writes to collectors that aren't listed
    set:
      telemetryServices:
        sdkInjector:
          deploy: true
          allowedConfigMapWriters: system:serviceaccount:monitoring:someone-else
      collectors:
        alloy-singleton: {presets: [singleton], rbac: {mode: minimal}}
    asserts:
      - hasDocuments:
          count: 3
        template: alloy-config.yaml
