---
apiVersion: v1
kind: Namespace
metadata:
  name: namespace-one
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: namespace-one
spec:
  interval: 1m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8smon-one
  namespace: namespace-one
spec:
  interval: 1m
  chart:
    spec:
      chart: k8s-monitoring
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: namespace-one
      interval: 1m
  values:
    cluster:
      name: multi-deployment-one

    destinations:
      localPrometheus:
        type: prometheus
        url: http://prometheus-server.prometheus.svc:9090/api/v1/write
        auth:
          type: basic
          username: promuser
          password: prometheuspassword
      localLoki:
        type: loki
        url: http://loki.loki.svc:3100/loki/api/v1/push
        tenantId: "1"
        auth:
          type: basic
          username: loki
          password: lokipassword

    clusterMetrics:
      enabled: true
      collector: alloy-metrics

    hostMetrics:
      enabled: true
      collector: alloy-metrics
      linuxHosts:
        enabled: true

    clusterEvents:
      enabled: true
      collector: alloy-singleton

    podLogsViaLoki:
      enabled: true
      collector: alloy-logs

    telemetryServices:
      kube-state-metrics:
        deploy: true
      node-exporter:
        deploy: true

    collectors:
      alloy-metrics:
        presets: [clustered, statefulset]
      alloy-singleton:
        presets: [singleton]
      alloy-logs:
        presets: [filesystem-log-reader, daemonset]
