---
# Ships the collectors' own logs to Loki with its own RBAC, so the forbidden check doesn't depend on the RBAC under test.
apiVersion: v1
kind: Namespace
metadata:
  name: collector-logs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector-logs
  namespace: collector-logs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: collector-logs
  namespace: default
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: collector-logs
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: collector-logs
subjects:
  - kind: ServiceAccount
    name: collector-logs
    namespace: collector-logs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-logs
  namespace: collector-logs
data:
  config.alloy: |
    discovery.kubernetes "collectors" {
      role = "pod"
      namespaces {
        names = ["default"]
      }
    }

    discovery.relabel "collectors" {
      targets = discovery.kubernetes.collectors.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        regex         = "alloy"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
        target_label  = "instance"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        target_label = "job"
        replacement  = "collector-logs"
      }
    }

    loki.source.kubernetes "collectors" {
      targets    = discovery.relabel.collectors.output
      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        url       = "http://loki.loki.svc:3100/loki/api/v1/push"
        tenant_id = "1"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-logs
  namespace: collector-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector-logs
  template:
    metadata:
      labels:
        app: collector-logs
    spec:
      serviceAccountName: collector-logs
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.20.0
          args: [run, /etc/alloy/config.alloy, --storage.path=/tmp/alloy]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
      volumes:
        - name: config
          configMap:
            name: collector-logs
