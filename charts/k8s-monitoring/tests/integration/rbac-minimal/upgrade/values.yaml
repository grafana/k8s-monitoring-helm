---
cluster:
  name: rbac-minimal-upgrade

destinations:
  prometheus:
    type: prometheus
    url: http://prometheus-server.prometheus.svc:9090/api/v1/write
    auth:
      type: basic
      username: promuser
      password: prometheuspassword
    extraLabels:
      phase: upgraded
  loki:
    type: loki
    url: http://loki.loki.svc:3100/loki/api/v1/push
    tenantId: "1"
    auth:
      type: basic
      username: loki
      password: lokipassword
    extraLabels:
      phase: upgraded

clusterMetrics:
  enabled: true
  collector: alloy-metrics
  apiServer:
    enabled: true
  # Only after the upgrade, because the Alloy chart's ClusterRole doesn't grant nodes/proxy.
  kubeletProbes:
    enabled: true
    nodeAddressFormat: proxy

hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true

clusterEvents:
  enabled: true
  collector: alloy-singleton

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

collectorCommon:
  alloy:
    rbac:
      mode: minimal
    # Restart the collectors, so that they only have the new RBAC when they start watching the Kubernetes API.
    controller:
      podAnnotations:
        k8s.grafana.com/rbac-mode: minimal

collectors:
  alloy-metrics:
    presets: [clustered, statefulset]
  alloy-singleton:
    presets: [singleton]
  alloy-logs:
    presets: [filesystem-log-reader, daemonset]

telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
