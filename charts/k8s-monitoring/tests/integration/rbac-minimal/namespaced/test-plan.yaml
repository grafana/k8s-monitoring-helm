---
apiVersion: helm-chart-toolbox.grafana.com/v1
kind: TestPlan
name: rbac-minimal-namespaced

subject:
  releaseName: k8smon
  path: ../../../..
  valuesFile: values.yaml

cluster:
  type: kind

dependencies:
  - file: dependencies/credentials.yaml
  - file: dependencies/team-a.yaml
  - preset: prometheus
  - preset: loki
  - preset: grafana
    overrides:
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              url: http://prometheus-server.prometheus.svc:9090
              isDefault: true
            - name: Loki
              type: loki
              url: http://loki-gateway.loki.svc:8080
              basicAuth: true
              basicAuthUser: loki
              jsonData:
                httpHeaderName1: X-Scope-OrgID
              secureJsonData:
                basicAuthPassword: lokipassword
                httpHeaderValue1: "1"

tests:
  - type: kubernetes-objects-test
    values:
      checks:
        - {kind: Role, name: k8smon-alloy-metrics-default-rbac, namespace: team-a}
        - {kind: Role, name: k8smon-alloy-logs-default-rbac, namespace: team-a}
        - {kind: Role, name: k8smon-alloy-singleton-default-rbac, namespace: team-a}
        - {kind: Role, name: k8smon-alloy-logs-default-rbac, namespace: credentials}
        - {kind: Role, name: k8smon-alloy-metrics-rbac, namespace: default}
        - {kind: ClusterRole, name: k8smon-alloy-logs-rbac, expect: {count: 0}}
        - {kind: ClusterRole, name: k8smon-alloy-singleton-rbac, expect: {count: 0}}
        - {kind: ClusterRole, name: k8smon-alloy-metrics, expect: {count: 0}}
        - {kind: ClusterRole, name: k8smon-alloy-logs, expect: {count: 0}}
        - {kind: ClusterRole, name: k8smon-alloy-singleton, expect: {count: 0}}

  - type: query-test
    values:
      tests:
        - env:
            CLUSTER: rbac-minimal-namespaced
            PROMETHEUS_URL: http://prometheus-server.prometheus.svc:9090/api/v1/query
            PROMETHEUS_USER: promuser
            PROMETHEUS_PASS: prometheuspassword
            LOKI_URL: http://loki.loki.svc:3100/loki/api/v1/query
            LOKI_TENANTID: 1
            LOKI_USER: loki
            LOKI_PASS: lokipassword
          queries:
            # Pod discovery in team-a, with the Prometheus credentials from a chart-created Secret
            - query: node_exporter_build_info{cluster="$CLUSTER", namespace="team-a"}
              type: promql
            # Events from team-a, with the Loki credentials from a Secret in another namespace
            - query: count_over_time({cluster="$CLUSTER", job="integrations/kubernetes/eventhandler", namespace="team-a"}[1h])
              type: logql
            # Pod logs from team-a
            - query: count_over_time({cluster="$CLUSTER", namespace="team-a", job!="integrations/kubernetes/eventhandler"}[1h])
              type: logql
