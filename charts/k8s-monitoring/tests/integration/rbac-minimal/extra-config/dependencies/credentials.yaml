---
apiVersion: v1
kind: Namespace
metadata:
  name: credentials
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-credentials
  namespace: credentials
stringData:
  username: promuser
  password: prometheuspassword
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rbac-settings
  namespace: credentials
data:
  source: configmap
---
# Kubernetes discovery only makes targets from Ingress rules, so this needs one. Nothing serves it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rbac-ingress
  namespace: credentials
spec:
  rules:
    - host: rbac.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rbac-backend
                port:
                  number: 80
