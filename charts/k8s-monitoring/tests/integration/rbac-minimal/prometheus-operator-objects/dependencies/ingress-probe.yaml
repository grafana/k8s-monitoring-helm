---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana-ingress
spec:
  rules:
    - host: grafana.grafana.svc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: grafana-ingress-probe
  namespace: grafana
spec:
  interval: 60s
  module: http_2xx
  prober:
    path: /probe
    url: blackbox-exporter-prometheus-blackbox-exporter.blackbox-exporter.svc:9115
  targets:
    ingress:
      namespaceSelector:
        matchNames:
          - grafana
      selector:
        matchLabels:
          app.kubernetes.io/name: grafana-ingress
