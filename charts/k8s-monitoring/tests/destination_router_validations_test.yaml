# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Validations - Router Destination
templates:
  - validations.yaml
tests:
  - it: requires at least one defaultDestinations entry (R1)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: equals
                  value: tenant-a
              destinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) does not have any defaultDestinations.
            A router is a terminal destination, so it must name at least one fallback destination for records that don't match any route.
            Please set:
            destinations:
              my-router:
                type: router
                defaultDestinations:
                  - my-destination

  - it: requires a valid ecosystem (one of loki, otlp, prometheus, pyroscope)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: equals
                  value: tenant-a
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) has an invalid or missing ecosystem: "".
            A router must set ecosystem to one of: loki, otlp, prometheus, pyroscope.
            Please set:
            destinations:
              my-router:
                type: router
                ecosystem: otlp

  - it: rejects a destination that supports no signal the router's ecosystem routes (R11)
    set:
      cluster: {name: test-cluster}
      destinations:
        my-profiles:
          type: pyroscope
          url: https://pyroscope.example.com
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: equals
                  value: tenant-a
              destinations: [my-profiles]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router, ecosystem: otlp) fans out to destination "my-profiles" (type: pyroscope), which cannot receive any signal an otlp router routes (metrics, logs, traces).
            Point this router only at destinations that support metrics/logs/traces, or change the router's ecosystem.

  - it: rejects a route whose match is not a list of conditions (RM0)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match: {equals: tenant-a}
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) has a route (#1) whose match is not a list.
            A route's match must be a list of {resourceAttribute, op, value} conditions (ANDed together).
            Please set:
            destinations:
              my-router:
                type: router
                ecosystem: otlp
                routes:
                  - match:
                      - resourceAttribute: k8s.namespace.name
                        op: equals
                        value: my-value

  - it: rejects a route with an empty match (RM0)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) has a route (#1) with an empty match.
            Every route needs at least one match condition.

  - it: rejects a match condition that is not a map (RM1)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - "k8s.namespace.name"
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) route #1 condition #1 is not a map.
            Each condition must be a map with resourceAttribute, op, and value.

  - it: rejects a match condition that uses the wrong key for the router's ecosystem (RM1)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - label: namespace
                  op: equals
                  value: tenant-a
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router, ecosystem: otlp) route #1 condition #1 uses `label`, but an otlp router matches on `resourceAttribute`.

  - it: rejects a match condition that omits the ecosystem's expected key (RM1)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - op: equals
                  value: tenant-a
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router, ecosystem: otlp) route #1 condition #1 must set `resourceAttribute`.

  - it: rejects a resourceAttribute that isn't a valid attribute name (RM1)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: "bad attr"
                  op: equals
                  value: tenant-a
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) route #1 condition #1 has an invalid resourceAttribute: "bad attr".
            It must start with a letter or underscore and contain only letters, digits, underscores, dots, slashes, and hyphens -- no quotes, backticks, backslashes, or whitespace.

  - it: rejects a label that isn't a valid Prometheus label name (RM1)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: prometheus
          routes:
            - match:
                - label: "bad label"
                  op: equals
                  value: tenant-a
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) route #1 condition #1 has an invalid label: "bad label".
            A label must be a valid Prometheus label name: start with a letter or underscore and contain only letters, digits, and underscores.

  - it: rejects a match condition with an invalid or missing op (RM2)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: startsWith
                  value: tenant-a
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) route #1 condition #1 has an invalid or missing op: "startsWith".
            op must be one of: equals, notEquals, in, matches, notMatches.

  - it: rejects a prometheus router condition using a negating op (RM2)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: prometheus
          routes:
            - match:
                - label: namespace
                  op: notEquals
                  value: tenant-a
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router, ecosystem: prometheus) route #1 condition #1 uses op `notEquals`, which the Prometheus/Loki/Pyroscope pipelines cannot express.
            Use equals, in, or matches -- or an otlp router for negation.

  - it: rejects a prometheus router that combines op `matches` with other conditions (RM2)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: prometheus
          routes:
            - match:
                - label: namespace
                  op: matches
                  value: "^tenant-.*$"
                - label: team
                  op: equals
                  value: team-a
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router, ecosystem: prometheus) route #1 condition #1 uses op `matches` alongside other conditions.
            A label-based route combines its conditions by joining labels with a separator, which a regular expression `matches` cannot participate in. Use `matches` in a single-condition route, or switch to equals/in.

  - it: rejects op `in` whose value is a string instead of a list (RM3)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: in
                  value: "foo"
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) route #1 condition #1 uses op `in`, so value must be a list: foo.
            Please set value to a list, e.g. `value: [a, b]`.

  - it: rejects op `in` with an empty value list (RM3)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: in
                  value: []
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) route #1 condition #1 uses op `in` with an empty value list.
            `in` needs at least one value to match against.

  - it: rejects a non-string value for a scalar op (RM3)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: equals
                  value: true
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) route #1 condition #1 op `equals` requires a string value: true.
            Please quote it so it isn't parsed as a YAML number, boolean, or null.

  - it: rejects a non-string entry in an `in` value list (RM3)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: in
                  value: [123]
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) route #1 condition #1 has a non-string value in its `in` list: 123.
            Please quote it so it isn't parsed as a YAML number, boolean, or null.

  - it: rejects a non-string value for op `matches` (RM3)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: matches
                  value: false
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) route #1 condition #1 op `matches` requires a string value: false.
            Please quote it so it isn't parsed as a YAML number, boolean, or null.

  - it: rejects a `matches` value that does not compile as a regex (RM4)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: matches
                  value: "["
              destinations: [platform]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorPattern: error parsing regexp

  - it: rejects a route destination that does not exist (R6)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: equals
                  value: tenant-a
              destinations: [doesnotexist]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) has a route (#1) referencing unknown destination "doesnotexist".
            The destination must exist and be enabled.
            Please reference one of the known destinations:
              platform

  - it: rejects a route with an empty or missing destinations list (R5b)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: equals
                  value: tenant-a
              destinations: []
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) has a route (#1) with an empty or missing destinations list.
            A route with no destinations would silently drop every record that matches it.
            Please set at least one destination:
            destinations:
              my-router:
                type: router
                routes:
                  - match:
                      - resourceAttribute: k8s.namespace.name
                        op: equals
                        value: my-value
                    destinations:
                      - my-destination

  - it: rejects a defaultDestinations entry that is disabled (R6)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
          disabled: true
        my-router:
          type: router
          ecosystem: otlp
          routes: []
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) has a defaultDestinations entry referencing unknown destination "platform".
            The destination must exist and be enabled.
            Please reference one of the known destinations:

  - it: rejects an empty signals list on a route (R7)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: equals
                  value: tenant-a
              destinations: [platform]
              signals: []
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) has a route (#1) with an empty signals list.
            Either remove the signals field to match all signals, or list at least one of: metrics, logs, traces, profiles.

  - it: rejects an unknown signal name on a route (R7)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: equals
                  value: tenant-a
              destinations: [platform]
              signals: [bogus]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) has a route (#1) with an unknown signal "bogus".
            Please use one of: metrics, logs, traces, profiles.

  - it: rejects a signal the router's ecosystem does not route (R7)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: prometheus
          routes:
            - match:
                - label: namespace
                  op: equals
                  value: tenant-a
              destinations: [platform]
              signals: [traces]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router, ecosystem: prometheus) has a route (#1) covering the "traces" signal, which this ecosystem does not route.
            An prometheus router routes: metrics.

  - it: rejects a route destination that is itself a router (R8)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        other-router:
          type: router
          ecosystem: otlp
          routes: []
          defaultDestinations: [platform]
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: equals
                  value: tenant-a
              destinations: [other-router]
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) has a route (#1) referencing another router destination "other-router".
            Routing telemetry from one router into another router would create a cycle in the generated Alloy pipeline, so it is not supported.
            Please point routes and defaultDestinations at real (non-router) destinations.

  - it: rejects a defaultDestinations entry that is itself a router (R8)
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        other-router:
          type: router
          ecosystem: otlp
          routes: []
          defaultDestinations: [platform]
        my-router:
          type: router
          ecosystem: otlp
          routes: []
          defaultDestinations: [other-router]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Destination "my-router" (type: router) has a defaultDestinations entry referencing another router destination "other-router".
            Routing telemetry from one router into another router would create a cycle in the generated Alloy pipeline, so it is not supported.
            Please point routes and defaultDestinations at real (non-router) destinations.

  - it: allows a valid router configuration with routes and defaults
    set:
      cluster: {name: test-cluster}
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: equals
                  value: tenant-a
              destinations: [platform]
          defaultDestinations: [platform]
      collectors: {alloy-receiver: {extraConfig: "// simulated feature"}}
    asserts:
      - notFailedTemplate: {}

---
# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
# This suite covers destinations.router.assertCanCarry, the seam check that replaced the old,
# false-positive-prone R10 (see destinations/_destination_router_validations.tpl). Unlike the
# suite above, these cases need a real, enabled feature forwarding real telemetry through the
# router -- that is the whole point of the seam (only dataProcessors.pipeline.targets.forFeature knows
# which signal a feature is actually sending, and via which collection ecosystem) -- so they
# render alloy-config.yaml, not validations.yaml.
suite: Validations - Router Destination Seam Check (destinations.router.assertCanCarry)
templates:
  - alloy-config.yaml
tests:
  - it: fails when a feature actually sends a signal to a router whose no-routes defaultDestinations cannot carry it
    set:
      cluster: {name: test-cluster}
      selfReporting: {enabled: false}
      podLogsViaOpenTelemetry:
        enabled: true
        destinations: [my-router]
      collectors:
        alloy-logs:
          presets: [filesystem-log-reader, daemonset]
          alloy:
            stabilityLevel: public-preview
      destinations:
        mimir:
          type: prometheus
          url: https://prometheus.example.com/api/v1/write
        my-router:
          type: router
          ecosystem: otlp
          routes: []
          defaultDestinations: [mimir]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Feature "podLogsViaOpenTelemetry" sends logs to router destination "my-router", but that router has no route or defaultDestinations entry that can accept logs.
            logs reaching this router would be dropped.
            Please add a destination that supports logs to the router's routes or defaultDestinations.

  - it: fails when a feature's signal only matches a route pointing at a destination that cannot carry it, and defaults can't either
    set:
      cluster: {name: test-cluster}
      selfReporting: {enabled: false}
      podLogsViaOpenTelemetry:
        enabled: true
        destinations: [my-router]
      collectors:
        alloy-logs:
          presets: [filesystem-log-reader, daemonset]
          alloy:
            stabilityLevel: public-preview
      destinations:
        mimir:
          type: prometheus
          url: https://prometheus.example.com/api/v1/write
        my-router:
          type: router
          ecosystem: otlp
          routes:
            - match:
                - resourceAttribute: k8s.namespace.name
                  op: equals
                  value: tenant-a
              destinations: [mimir]
              signals: [logs]
          defaultDestinations: [mimir]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Feature "podLogsViaOpenTelemetry" sends logs to router destination "my-router", but that router has no route or defaultDestinations entry that can accept logs.
            logs reaching this router would be dropped.
            Please add a destination that supports logs to the router's routes or defaultDestinations.

  - it: fails when an opentelemetry feature routes OTLP telemetry through a loki-ecosystem router (ecosystem mismatch)
    set:
      cluster: {name: test-cluster}
      selfReporting: {enabled: false}
      podLogsViaOpenTelemetry:
        enabled: true
        destinations: [my-router]
      collectors:
        alloy-logs:
          presets: [filesystem-log-reader, daemonset]
          alloy:
            stabilityLevel: public-preview
      destinations:
        loki-dest:
          type: loki
          url: https://loki.example.com
        my-router:
          type: router
          ecosystem: loki
          defaultDestinations: [loki-dest]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Feature "podLogsViaOpenTelemetry" collects logs via the otlp pipeline and routes it through router "my-router", but that router is declared ecosystem: loki.
            A router only routes data collected via its own ecosystem; point this feature at a router whose ecosystem is otlp.

  - it: fails when a prometheus feature routes metrics through an otlp-ecosystem router (ecosystem mismatch)
    set:
      cluster: {name: test-cluster}
      selfReporting: {enabled: false}
      clusterMetrics:
        enabled: true
        destinations: [my-router]
      telemetryServices:
        kube-state-metrics:
          deploy: true
      collectors:
        alloy-metrics:
          presets: [clustered]
      destinations:
        platform:
          type: otlp
          url: https://otlp.example.com
        my-router:
          type: router
          ecosystem: otlp
          defaultDestinations: [platform]
    asserts:
      - failedTemplate:
          errorMessage: |-
            Feature "clusterMetrics" collects metrics via the prometheus pipeline and routes it through router "my-router", but that router is declared ecosystem: otlp.
            A router only routes data collected via its own ecosystem; point this feature at a router whose ecosystem is prometheus.

  - it: allows a no-routes fan-out router with otlp defaultDestinations when the only feature routed through it sends logs (false-positive fix)
    set:
      cluster: {name: test-cluster}
      selfReporting: {enabled: false}
      podLogsViaOpenTelemetry:
        enabled: true
        destinations: [fanout]
      collectors:
        alloy-logs:
          presets: [filesystem-log-reader, daemonset]
          alloy:
            stabilityLevel: public-preview
      destinations:
        a:
          type: otlp
          url: https://otlp-a.example.com
        b:
          type: otlp
          url: https://otlp-b.example.com
        fanout:
          type: router
          ecosystem: otlp
          defaultDestinations: [a, b]
    asserts:
      - notFailedTemplate: {}

