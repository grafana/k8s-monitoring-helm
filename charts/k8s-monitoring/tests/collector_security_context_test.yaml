# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Collectors - Default Security Context
templates:
  - alloy.yaml
tests:
  - it: drops all capabilities and only adds back NET_BIND_SERVICE
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-metrics:
          extraConfig: "// Giving this Alloy something to do"
    asserts:
      - equal:
          path: spec.alloy.securityContext.capabilities
          value:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]
      - equal:
          path: spec.alloy.securityContext.allowPrivilegeEscalation
          value: false
      - notExists:
          path: spec.alloy.securityContext.privileged

  - it: allows the added capabilities to be overridden
    set:
      cluster: {name: test-cluster}
      collectorCommon:
        alloy:
          alloy:
            securityContext:
              capabilities:
                add: ["CHOWN", "DAC_OVERRIDE"]
      collectors:
        alloy-metrics:
          extraConfig: "// Giving this Alloy something to do"
    asserts:
      - equal:
          path: spec.alloy.securityContext.capabilities
          value:
            drop: ["ALL"]
            add: ["CHOWN", "DAC_OVERRIDE"]
