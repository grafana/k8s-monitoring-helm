        collector: alloy-metrics
    kubernetesProvider:
      scheme:
        "v1/Node":
          gvr:
            version: "v1"
            resource: "nodes"
          namespaced: false
        "apps/v1/DaemonSet":
          gvr:
            group: "apps"
            version: "v1"
            resource: "daemonsets"
          namespaced: true
        "apps/v1/Deployment":
          gvr:
            group: "apps"
            version: "v1"
            resource: "deployments"
          namespaced: true
      objects:
        - kind: Node
          apiVersion: v1
          metadata:
            name: node1
        - kind: Deployment
          apiVersion: apps/v1
          metadata:
            name: some-app
            namespace: default
          spec:
            template:
              spec:
                containers:
                  - name: app
                    image: registry.k8s.io/pause:3.9
        - kind: DaemonSet
          apiVersion: apps/v1
          metadata:
            name: beyla
            namespace: beyla
            labels:
              app.kubernetes.io/name: beyla
          spec:
            template:
              spec:
                hostNetwork: true
                containers:
                  - name: beyla
                    image: docker.io/grafana/beyla:3.25.0
                    ports:
                      - containerPort: "9091"
    asserts:
      - notFailedTemplate: {}

  - it: does not fail for a pod-local containerPort with no hostNetwork or hostPort
    set:
