          spec:
            template:
              spec:
                containers:
                  - name: agent
                    image: registry.k8s.io/pause:3.9
                    ports:
                      - containerPort: "9090"
    asserts:
      - notFailedTemplate: {}

  - it: ignores the Beyla managed by this release
    set:
      cluster:
        name: ci-test-cluster
      destinations:
        metrics-service:
          type: prometheus
          url: http://prometheus.prometheus.svc:9090/api/v1/write
      collectors:
        alloy-metrics:
          presets: [clustered]
      autoInstrumentation:
        enabled: true
        collector: alloy-metrics
    kubernetesProvider:
      scheme:
        "v1/Node":
          gvr:
            version: "v1"
            resource: "nodes"
          namespaced: false
        "apps/v1/DaemonSet":
          gvr:
            group: "apps"
            version: "v1"
            resource: "daemonsets"
          namespaced: true
        "apps/v1/Deployment":
          gvr:
            group: "apps"
            version: "v1"
            resource: "deployments"
          namespaced: true
      objects:
        - kind: Node
          apiVersion: v1
          metadata:
            name: node1
        - kind: Deployment
          apiVersion: apps/v1
          metadata:
            name: some-app
            namespace: default
          spec:
            template:
              spec:
                containers:
                  - name: app
                    image: registry.k8s.io/pause:3.9
        - kind: DaemonSet
          apiVersion: apps/v1
          metadata:
            name: RELEASE-NAME-beyla
            namespace: NAMESPACE
            labels:
              app.kubernetes.io/name: beyla
              app.kubernetes.io/instance: RELEASE-NAME
          spec:
            template:
              spec:
                hostNetwork: true
                containers:
                  - name: beyla
                    image: docker.io/grafana/beyla:3.25.0
                    ports:
                      - containerPort: "9090"
    asserts:
      - notFailedTemplate: {}

  - it: does not fail when the port conflict check is disabled, even with a conflicting workload
