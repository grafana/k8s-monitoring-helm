# yamllint disable rule:document-start rule:line-length rule:trailing-spaces rule:braces rule:commas
suite: RBAC - Minimal mode - Scanner
release:
  name: test
  namespace: monitoring
templates:
  - alloy-config.yaml
set:
  cluster: {name: test-cluster}
  selfReporting: {enabled: false}
tests:
  - it: grants what the components in extraConfig need
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "services" {
              role = "service"
            }
            remote.kubernetes.secret "credentials" {
              name      = "credentials"
              namespace = "apps"
            }
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [services], verbs: [get, list, watch]}
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: Role}
        isSubset:
          path: metadata
          content: {name: test-alloy-singleton-monitoring-rbac, namespace: apps}
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: Role}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resourceNames: [credentials], resources: [secrets], verbs: [get]}
        template: alloy-config.yaml

  - it: grants get on the named Secret in every namespace when the namespace isn't a literal string
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            remote.kubernetes.secret "credentials" {
              name      = "credentials"
              namespace = sys.env("SECRET_NAMESPACE")
            }
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resourceNames: [credentials], resources: [secrets], verbs: [get]}
        template: alloy-config.yaml

  - it: grants get on every Secret in the namespace when the name isn't a literal string
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            remote.kubernetes.secret "credentials" {
              name      = "db-" + sys.env("ENVIRONMENT")
              namespace = "apps"
            }
    asserts:
      - hasDocuments:
          count: 3
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: Role}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [secrets], verbs: [get]}
        template: alloy-config.yaml

  - it: finds components that have nested blocks
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            remote.kubernetes.secret "credentials" {
              name      = "credentials"
              namespace = "apps"
              client {
                tls_config {
                  insecure_skip_verify = true
                }
              }
            }
    asserts:
      - documentSelector: {path: kind, value: Role}
        isSubset:
          path: metadata
          content: {namespace: apps}
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: Role}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resourceNames: [credentials], resources: [secrets], verbs: [get]}
        template: alloy-config.yaml

  - it: scopes discovery to the namespaces in its configuration
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "pods" {
              role = "pod"
              namespaces {
                names = ["team-a"]
              }
            }
    asserts:
      - hasDocuments:
          count: 3
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: Role}
        isSubset:
          path: metadata
          content: {namespace: team-a}
        template: alloy-config.yaml

  - it: grants what a replaced component needs
    set:
      clusterEvents: {enabled: true}
      destinations:
        loki: {type: loki, url: http://loki.loki.svc:3100/loki/api/v1/push}
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
      replaceComponent:
        - type: loki.source.kubernetes_events
          module: cluster_events
          name: cluster_events
          content: |-
            forward_to = [loki.process.cluster_events.receiver]
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [events], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: only grants a replaced component's access to the collectors it was replaced on
    set:
      clusterEvents: {enabled: true, collector: alloy-singleton}
      destinations:
        loki: {type: loki, url: http://loki.loki.svc:3100/loki/api/v1/push}
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
        alloy-other:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: " "
      replaceComponent:
        - type: loki.source.kubernetes_events
          module: cluster_events
          name: cluster_events
          content: |-
            forward_to = [loki.process.cluster_events.receiver]
    asserts:
      - documentSelector:
          path: "$[?(@.kind == 'ClusterRole' && @.metadata.name == 'test-alloy-singleton-monitoring-rbac')].kind"
          value: ClusterRole
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [events], verbs: [get, list, watch]}
        template: alloy-config.yaml
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
          name: test-alloy-other-monitoring-rbac
          any: true
        not: true
        template: alloy-config.yaml

  - it: ignores custom data processor blocks that a collector doesn't render
    set:
      clusterEvents: {enabled: true, dataProcessors: [label]}
      destinations:
        loki: {type: loki, url: http://loki.loki.svc:3100/loki/api/v1/push}
      dataProcessors:
        label:
          type: custom
          logs:
            loki:
              enabled: true
              input: loki.process.label.receiver
              config: |-
                loki.process "label" {
                  forward_to = [loki.process.label_out_logs_loki.receiver]
                }
          metrics:
            prometheus:
              enabled: false
              input: prometheus.relabel.label.receiver
              config: |-
                discovery.kubernetes "pods" {
                  role = "pod"
                }
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [events], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: grants what a custom destination's configuration needs
    set:
      clusterEvents: {enabled: true, namespaces: [team-a]}
      destinations:
        custom-loki:
          type: custom
          logs: {enabled: true}
          ecosystem: loki
          config: |-
            remote.kubernetes.configmap "settings" {
              name      = "settings"
              namespace = "config"
            }
            loki.write "custom_loki" {
              endpoint {
                url = convert.nonsensitive(remote.kubernetes.configmap.settings.data["url"])
              }
            }
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
    asserts:
      - documentSelector:
          path: "$[?(@.kind == 'Role' && @.metadata.namespace == 'config')].kind"
          value: Role
        equal:
          path: rules
          value:
            - {apiGroups: [""], resourceNames: [settings], resources: [configmaps], verbs: [get]}
        template: alloy-config.yaml

  - it: finds components with blocks nested several levels deep
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            otelcol.exporter.loadbalancing "traces" {
              resolver {
                kubernetes {
                  service = "sampler"
                }
              }
              protocol {
                otlp {
                  client {
                    tls {
                      insecure = true
                    }
                  }
                }
              }
            }
    asserts:
      - documentSelector: {path: kind, value: Role}
        isSubset:
          path: metadata
          content: {name: test-alloy-singleton-rbac, namespace: monitoring}
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: Role}
        equal:
          path: rules
          value:
            - {apiGroups: [discovery.k8s.io], resources: [endpointslices], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: scopes discovery to namespaces listed across several lines
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "pods" {
              role = "pod"
              namespaces {
                names = [
                  "team-a",
                  "team-b",
                ]
              }
            }
    asserts:
      - hasDocuments:
          count: 5
        template: alloy-config.yaml
      - documentSelector:
          path: "$[?(@.kind == 'Role' && @.metadata.namespace == 'team-b')].kind"
          value: Role
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: scopes discovery to the release namespace and the listed namespaces with own_namespace
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "pods" {
              role = "pod"
              namespaces {
                own_namespace = true
                names         = ["team-a"]
              }
            }
    asserts:
      - documentSelector:
          path: "$[?(@.kind == 'Role' && @.metadata.namespace == 'monitoring')].kind"
          value: Role
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
        template: alloy-config.yaml
      - documentSelector:
          path: "$[?(@.kind == 'Role' && @.metadata.namespace == 'team-a')].kind"
          value: Role
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
        template: alloy-config.yaml
      - hasDocuments:
          count: 5
        template: alloy-config.yaml

  - it: grants every discovery role cluster-wide when the role isn't a literal string
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "dynamic" {
              role = sys.env("ROLE")
              namespaces {
                names = ["team-a"]
              }
            }
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [discovery.k8s.io], resources: [endpointslices], verbs: [get, list, watch]}
            - {apiGroups: [networking.k8s.io], resources: [ingresses], verbs: [get, list, watch]}
            - {apiGroups: [""], resources: [endpoints, nodes, pods, services], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: ignores braces inside strings and comments
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            // A comment with a stray { brace
            discovery.kubernetes "brace" {
              role = "service"
              selectors {
                role  = "service"
                label = "a={b"
              }
            }
            discovery.kubernetes "raw" {
              role = "pod"
              selectors {
                role  = "pod"
                field = `metadata.name={x`
              }
            }
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [pods, services], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: keeps cluster-scoped resources in the ClusterRole when a component is limited to namespaces
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "nodes" {
              role = "node"
              namespaces {
                names = ["team-a"]
              }
            }
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [nodes], verbs: [get, list, watch]}
        template: alloy-config.yaml
      - hasDocuments:
          count: 3
        template: alloy-config.yaml

  - it: fails when a component block can't be read
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "deep" {
              role = "pod"
              a { b { c { d { e { f { g { h { i { } } } } } } } } }
            }
    asserts:
      - failedTemplate:
          errorPattern: 'The alloy-singleton collector has a discovery.kubernetes block that can.t be read'
        template: alloy-config.yaml

  - it: scopes components in a module to the namespaces its calls pass
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            declare "pods" {
              argument "namespaces" {
                optional = true
              }
              discovery.kubernetes "pods" {
                role = "pod"
                namespaces {
                  names = coalesce(argument.namespaces.value, [])
                }
              }
            }
            pods "team_a" {
              namespaces = ["team-a"]
            }
            pods "team_b" {
              namespaces = ["team-b"]
            }
    asserts:
      - hasDocuments:
          count: 5
        template: alloy-config.yaml
      - documentSelector:
          path: "$[?(@.kind == 'Role' && @.metadata.namespace == 'team-b')].kind"
          value: Role
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: grants every namespace when a module call doesn't pass the namespaces argument
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            declare "pods" {
              argument "namespaces" {
                optional = true
              }
              discovery.kubernetes "pods" {
                role = "pod"
                namespaces {
                  names = coalesce(argument.namespaces.value, [])
                }
              }
            }
            pods "team_a" {
              namespaces = ["team-a"]
            }
            pods "everything" { }
    asserts:
      - hasDocuments:
          count: 3
        template: alloy-config.yaml
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: follows module calls in nested modules, and skips modules that shadow the name
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            declare "pods" {
              argument "namespaces" { }
              discovery.kubernetes "pods" {
                role = "pod"
                namespaces {
                  names = argument.namespaces.value
                }
              }
            }
            pods "team_a" {
              namespaces = ["team-a"]
            }
            declare "wrapper" {
              pods "team_b" {
                namespaces = ["team-b"]
              }
            }
            wrapper "w" { }
            declare "shadow" {
              declare "pods" {
                argument "namespaces" { }
                discovery.kubernetes "services" {
                  role = "service"
                  namespaces {
                    names = argument.namespaces.value
                  }
                }
              }
              pods "team_c" {
                namespaces = ["team-c"]
              }
            }
            shadow "s" { }
    asserts:
      - hasDocuments:
          count: 7
        template: alloy-config.yaml
      - documentSelector:
          path: "$[?(@.kind == 'Role' && @.metadata.namespace == 'team-b')].kind"
          value: Role
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
        template: alloy-config.yaml
      - documentSelector:
          path: "$[?(@.kind == 'Role' && @.metadata.namespace == 'team-c')].kind"
          value: Role
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [services], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: grants nodes/metrics to scrapes of Node targets that send the ServiceAccount token
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "nodes" {
              role = "node"
            }
            discovery.relabel "kubelet" {
              targets = discovery.kubernetes.nodes.targets
            }
            prometheus.scrape "kubelet" {
              targets           = discovery.relabel.kubelet.output
              scheme            = "https"
              bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              forward_to        = []
            }
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [nodes/metrics], verbs: [get]}
            - {apiGroups: [""], resources: [nodes], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: grants nodes/proxy to scrapes through the API server's Node proxy
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "nodes" {
              role = "node"
            }
            discovery.relabel "kubelet" {
              targets = discovery.kubernetes.nodes.targets
              rule {
                target_label = "__address__"
                replacement  = "kubernetes.default.svc:443"
              }
              rule {
                source_labels = ["__meta_kubernetes_node_name"]
                replacement   = "/api/v1/nodes/${1}/proxy/metrics"
                target_label  = "__metrics_path__"
              }
            }
            prometheus.scrape "kubelet" {
              targets           = discovery.relabel.kubelet.output
              scheme            = "https"
              bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              forward_to        = []
            }
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [nodes/proxy], verbs: [get]}
            - {apiGroups: [""], resources: [nodes], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: grants /metrics to other scrapes that send the ServiceAccount token, following every source of targets
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "pods" {
              role = "pod"
            }
            discovery.kubernetes "services" {
              role = "service"
            }
            prometheus.scrape "secure" {
              targets = array.concat(
                discovery.kubernetes.pods.targets,
                discovery.kubernetes.services.targets,
              )
              bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              forward_to        = []
            }
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [pods, services], verbs: [get, list, watch]}
            - {nonResourceURLs: [/metrics], verbs: [get]}
        template: alloy-config.yaml

  - it: grants static targets that are mixed with discovered targets
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "nodes" {
              role = "node"
            }
            prometheus.scrape "mixed" {
              targets = array.concat(
                [{"__address__" = "kubernetes.default.svc:443"}],
                discovery.kubernetes.nodes.targets,
              )
              bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              forward_to        = []
            }
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [nodes/metrics], verbs: [get]}
            - {apiGroups: [""], resources: [nodes], verbs: [get, list, watch]}
            - {nonResourceURLs: [/metrics], verbs: [get]}
        template: alloy-config.yaml

  - it: grants nothing more to profile scrapes of Pods that send the ServiceAccount token
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "pods" {
              role = "pod"
            }
            pyroscope.scrape "pods" {
              targets           = discovery.kubernetes.pods.targets
              bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              forward_to        = []
            }
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
        equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
        template: alloy-config.yaml

  - it: fails when a profile scrape sends the ServiceAccount token to Nodes
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "nodes" {
              role = "node"
            }
            pyroscope.scrape "nodes" {
              targets           = discovery.kubernetes.nodes.targets
              bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              forward_to        = []
            }
    asserts:
      - failedTemplate:
          errorPattern: 'has a pyroscope.scrape block that sends the ServiceAccount token to targets that minimal RBAC doesn.t support'
        template: alloy-config.yaml

  - it: fails when a scrape that sends the ServiceAccount token gets its targets from a module argument
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            declare "scrape" {
              argument "targets" { }
              prometheus.scrape "default" {
                targets           = argument.targets.value
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                forward_to        = []
              }
            }
    asserts:
      - failedTemplate:
          errorPattern: 'has a prometheus.scrape block that uses the ServiceAccount token, and where its targets come from can.t be followed'
        template: alloy-config.yaml

  - it: fails when a component that the catalog doesn't cover sends the ServiceAccount token
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            prometheus.remote_write "in_cluster" {
              endpoint {
                url               = "https://prometheus.monitoring.svc:9091/api/v1/write"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              }
            }
    asserts:
      - failedTemplate:
          errorPattern: 'The alloy-singleton collector has a prometheus.remote_write block that uses the ServiceAccount token, so rbac.mode: minimal can.t compute its RBAC'
        template: alloy-config.yaml

  - it: fails on modules loaded with import
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            import.git "modules" {
              repository = "https://github.com/grafana/alloy-modules.git"
              revision   = "main"
              path       = "modules/kubernetes/"
            }
    asserts:
      - failedTemplate:
          errorPattern: 'uses import.git, which loads configuration that can.t be scanned'
        template: alloy-config.yaml

  - it: fails when a declare block can't be read
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            declare "deep" {
              a { b { c { d { e { f { g { h { i { } } } } } } } } }
            }
    asserts:
      - failedTemplate:
          errorPattern: 'has a declare block that can.t be read'
        template: alloy-config.yaml

  - it: grants Nodes and Namespaces when attach_metadata sets them to a value that isn't a literal
    set:
      collectors:
        alloy-singleton:
          presets: [singleton]
          rbac: {mode: minimal}
          extraConfig: |-
            discovery.kubernetes "services" {
              role = "service"
              attach_metadata {
                node      = sys.env("ATTACH_NODE") == "true"
                namespace = sys.env("ATTACH_NAMESPACE") == "true"
              }
            }
    asserts:
      - documentSelector: {path: kind, value: ClusterRole}
