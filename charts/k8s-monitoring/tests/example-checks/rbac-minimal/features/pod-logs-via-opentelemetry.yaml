apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8smon-alloy-logs-rbac
  namespace: default
rules:
  - apiGroups:
      - ""
    resourceNames:
      - log-storage-k8smon-k8s-monitoring
    resources:
      - secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8smon-alloy-logs-rbac
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8smon-alloy-logs-rbac
subjects:
  - kind: ServiceAccount
    name: k8smon-alloy-logs
    namespace: default
