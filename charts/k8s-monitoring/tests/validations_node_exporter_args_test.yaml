# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Validations - Node Exporter arguments
templates:
  - validations.yaml
tests:
  - it: rejects filesystem type include when the effective args also exclude filesystem types
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-metrics:
          extraConfig: "// test"
      telemetryServices:
        node-exporter:
          deploy: true
          portConflictCheck: false
          extraArgs:
            - --collector.filesystem.fs-types-include=^ext4$
    asserts:
      - failedTemplate:
          errorMessage: |-
            The effective Node Exporter filesystem arguments contain mutually exclusive flags:
              - --collector.filesystem.fs-types-exclude conflicts with --collector.filesystem.fs-types-include
            Please remove one flag from each conflicting pair, or set the desired arguments together in telemetryServices.node-exporter.defaultArgs to replace the chart defaults.

  - it: rejects the deprecated filesystem type alias with an effective exclusion
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-metrics:
          extraConfig: "// test"
      telemetryServices:
        node-exporter:
          deploy: true
          portConflictCheck: false
          extraArgs:
            - --collector.filesystem.ignored-fs-types=^ext4$
    asserts:
      - failedTemplate:
          errorMessage: |-
            The effective Node Exporter filesystem arguments contain mutually exclusive flags:
              - --collector.filesystem.fs-types-exclude conflicts with deprecated --collector.filesystem.ignored-fs-types
            Please remove one flag from each conflicting pair, or set the desired arguments together in telemetryServices.node-exporter.defaultArgs to replace the chart defaults.

  - it: rejects mount point include when the effective args also exclude mount points
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-metrics:
          extraConfig: "// test"
      telemetryServices:
        node-exporter:
          deploy: true
          portConflictCheck: false
          extraArgs:
            - --collector.filesystem.mount-points-include=^/data$
    asserts:
      - failedTemplate:
          errorMessage: |-
            The effective Node Exporter filesystem arguments contain mutually exclusive flags:
              - --collector.filesystem.mount-points-exclude conflicts with --collector.filesystem.mount-points-include
            Please remove one flag from each conflicting pair, or set the desired arguments together in telemetryServices.node-exporter.defaultArgs to replace the chart defaults.

  - it: rejects the deprecated mount point alias with an effective exclusion
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-metrics:
          extraConfig: "// test"
      telemetryServices:
        node-exporter:
          deploy: true
          portConflictCheck: false
          extraArgs:
            - --collector.filesystem.ignored-mount-points=^/data$
    asserts:
      - failedTemplate:
          errorMessage: |-
            The effective Node Exporter filesystem arguments contain mutually exclusive flags:
              - --collector.filesystem.mount-points-exclude conflicts with deprecated --collector.filesystem.ignored-mount-points
            Please remove one flag from each conflicting pair, or set the desired arguments together in telemetryServices.node-exporter.defaultArgs to replace the chart defaults.

  - it: rejects deprecated exclusion aliases combined with include flags when defaults are cleared
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-metrics:
          extraConfig: "// test"
      telemetryServices:
        node-exporter:
          deploy: true
          portConflictCheck: false
          defaultArgs: []
          extraArgs:
            - --collector.filesystem.ignored-fs-types=^ext4$
            - --collector.filesystem.fs-types-include=^ext4$
            - --collector.filesystem.ignored-mount-points=^/data$
            - --collector.filesystem.mount-points-include=^/data$
    asserts:
      - failedTemplate:
          errorMessage: |-
            The effective Node Exporter filesystem arguments contain mutually exclusive flags:
              - deprecated --collector.filesystem.ignored-fs-types conflicts with --collector.filesystem.fs-types-include
              - deprecated --collector.filesystem.ignored-mount-points conflicts with --collector.filesystem.mount-points-include
            Please remove one flag from each conflicting pair, or set the desired arguments together in telemetryServices.node-exporter.defaultArgs to replace the chart defaults.

  - it: allows filesystem exclusions in extraArgs when defaultArgs removes the chart defaults
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-metrics:
          extraConfig: "// test"
      telemetryServices:
        node-exporter:
          deploy: true
          portConflictCheck: false
          defaultArgs: []
          extraArgs:
            - --collector.filesystem.fs-types-exclude=^tmpfs$
            - --collector.filesystem.mount-points-exclude=^/proc$
    asserts:
      - notFailedTemplate: {}

  - it: allows filesystem include flags when defaultArgs removes the matching exclusions
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-metrics:
          extraConfig: "// test"
      telemetryServices:
        node-exporter:
          deploy: true
          portConflictCheck: false
          defaultArgs: []
          extraArgs:
            - --collector.filesystem.fs-types-include=^ext4$
            - --collector.filesystem.mount-points-include=^/data$
    asserts:
      - notFailedTemplate: {}

  - it: allows non-conflicting defaultArgs and extraArgs overrides
    set:
      cluster: {name: test-cluster}
      collectors:
        alloy-metrics:
          extraConfig: "// test"
      telemetryServices:
        node-exporter:
          deploy: true
          portConflictCheck: false
          defaultArgs:
            - --collector.filesystem.fs-types-exclude=^old$
          extraArgs:
            - --collector.filesystem.fs-types-exclude=^new$
    asserts:
      - notFailedTemplate: {}
