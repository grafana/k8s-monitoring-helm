# yamllint disable rule:document-start rule:line-length
suite: SDK Injector trace resource attributes
templates:
  - alloy-config.yaml
tests:
  - it: normalizes resource flags when the SDK injector is deployed
    set:
      cluster: {name: test-cluster}
      selfReporting: {enabled: false}
      destinations:
        tempo:
          type: otlp
          url: http://tempo:4317
      collectors:
        alloy-receiver: {}
      applicationObservability:
        enabled: true
        collector: alloy-receiver
        alignServiceNameWithOTelSemConv: false
        overrideUnknownServiceNames: false
        receivers:
          otlp:
            grpc: {enabled: true}
        traces:
          transforms:
            resource:
              - 'set(attributes["custom"], "preserved")'
      telemetryServices.sdkInjector.deploy: true
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'span\.metrics\.skip.*true'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'span\.metrics\.skip.*false'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'context = "resource"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'custom.*preserved'
  - it: does not normalize flags when injection is disabled
    set:
      cluster: {name: test-cluster}
      selfReporting: {enabled: false}
      destinations:
        tempo:
          type: otlp
          url: http://tempo:4317
      collectors:
        alloy-receiver: {}
      applicationObservability:
        enabled: true
        collector: alloy-receiver
        alignServiceNameWithOTelSemConv: false
        overrideUnknownServiceNames: false
        receivers:
          otlp:
            grpc: {enabled: true}
        traces:
          transforms:
            resource:
              - 'set(attributes["custom"], "preserved")'
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'span\.metrics\.skip'
  - it: normalizes flags when Beyla uses an external injector
    set:
      cluster: {name: test-cluster}
      selfReporting: {enabled: false}
      destinations:
        tempo:
          type: otlp
          url: http://tempo:4317
      collectors:
        alloy-receiver: {}
      applicationObservability:
        enabled: true
        collector: alloy-receiver
        alignServiceNameWithOTelSemConv: false
        overrideUnknownServiceNames: false
        receivers:
          otlp:
            grpc: {enabled: true}
        traces:
          transforms:
            resource:
              - 'set(attributes["custom"], "preserved")'
      autoInstrumentation.enabled: true
      autoInstrumentation.beyla.injector.enabled: true
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'span\.metrics\.skip.*true'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'span\.metrics\.skip.*false'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'context = "resource"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'custom.*preserved'
  - it: does not enable normalization for disabled Beyla
    set:
      cluster: {name: test-cluster}
      selfReporting: {enabled: false}
      destinations:
        tempo:
          type: otlp
          url: http://tempo:4317
      collectors:
        alloy-receiver: {}
      applicationObservability:
        enabled: true
        collector: alloy-receiver
        alignServiceNameWithOTelSemConv: false
        overrideUnknownServiceNames: false
        receivers:
          otlp:
            grpc: {enabled: true}
        traces:
          transforms:
            resource:
              - 'set(attributes["custom"], "preserved")'
      autoInstrumentation.enabled: false
      autoInstrumentation.beyla.injector.enabled: true
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'span\.metrics\.skip'
  - it: does not generate trace statements when traces are disabled
    set:
      cluster: {name: test-cluster}
      selfReporting: {enabled: false}
      destinations:
        tempo:
          type: otlp
          url: http://tempo:4317
      collectors:
        alloy-receiver: {}
      applicationObservability:
        enabled: true
        collector: alloy-receiver
        alignServiceNameWithOTelSemConv: false
        overrideUnknownServiceNames: false
        receivers:
          otlp:
            grpc: {enabled: true}
        traces:
          transforms:
            resource:
              - 'set(attributes["custom"], "preserved")'
      telemetryServices.sdkInjector.deploy: true
      applicationObservability.traces.enabled: false
    asserts:
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: 'span\.metrics\.skip'
