# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Alloy Operator - Fleet Management
templates:
  - alloy.yaml
  - alloy-operator-fleet-management.yaml
  - validations.yaml
tests:
  - it: renders nothing extra when Fleet Management sync is disabled
    set:
      cluster: {name: test-cluster}
      collectorCommon:
        alloy:
          remoteConfig: {enabled: true, url: "https://fleet.example.com", auth: {username: "12345", password: "token"}}
      collectors:
        alloy-metrics:
          extraConfig: "// Giving this Alloy something to do"
    asserts:
      - hasDocuments:
          count: 0
        template: alloy-operator-fleet-management.yaml
      - notExists:
          path: metadata.labels["fleet.grafana.com/collector"]
        template: alloy.yaml

  - it: labels collectors and stores the operator's credentials
    set:
      cluster: {name: test-cluster}
      alloy-operator:
        fleetManagement: {enabled: true, url: "https://fleet.example.com", auth: {username: "12345", password: "token"}}
      collectors:
        alloy-metrics:
          extraConfig: "// Giving this Alloy something to do"
    asserts:
      - equal:
          path: metadata.labels
          value:
            fleet.grafana.com/collector: alloy-metrics
            fleet.grafana.com/release: RELEASE-NAME
        template: alloy.yaml
      - hasDocuments:
          count: 3
        template: alloy-operator-fleet-management.yaml
      - equal:
          path: metadata.name
          value: alloy-operator-fleet-management
        template: alloy-operator-fleet-management.yaml
        documentSelector: {path: kind, value: Secret}
      - equal:
          path: data
          value:
            url: aHR0cHM6Ly9mbGVldC5leGFtcGxlLmNvbQ==
            cluster: dGVzdC1jbHVzdGVy
            username: MTIzNDU=
            password: dG9rZW4=
        template: alloy-operator-fleet-management.yaml
        documentSelector: {path: kind, value: Secret}
      - equal:
          path: rules[0].resourceNames
          value: [alloy-operator-fleet-management]
        template: alloy-operator-fleet-management.yaml
        documentSelector: {path: kind, value: Role}
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-alloy-operator
        template: alloy-operator-fleet-management.yaml
        documentSelector: {path: kind, value: RoleBinding}

  - it: ignores the collectors' remote config
    set:
      cluster: {name: test-cluster}
      alloy-operator:
        fleetManagement: {enabled: true, url: "https://fleet.example.com", auth: {username: "12345", password: "token"}}
      collectorCommon:
        alloy:
          remoteConfig: {enabled: true, url: "https://collectors.example.com", auth: {username: "67890", password: "collector-token"}}
      collectors:
        alloy-metrics:
          extraConfig: "// Giving this Alloy something to do"
    asserts:
      - equal:
          path: data
          value:
            url: aHR0cHM6Ly9mbGVldC5leGFtcGxlLmNvbQ==
            cluster: dGVzdC1jbHVzdGVy
            username: MTIzNDU=
            password: dG9rZW4=
        template: alloy-operator-fleet-management.yaml
        documentSelector: {path: kind, value: Secret}

  - it: stores the operator's credentials when there are no collectors
    set:
      cluster: {name: test-cluster}
      alloy-operator:
        fleetManagement: {enabled: true, url: "https://fleet.example.com", auth: {username: 12345, password: "token"}}
    asserts:
      - hasDocuments:
          count: 0
        template: alloy.yaml
      - hasDocuments:
          count: 3
        template: alloy-operator-fleet-management.yaml
      - equal:
          path: data
          value:
            url: aHR0cHM6Ly9mbGVldC5leGFtcGxlLmNvbQ==
            cluster: dGVzdC1jbHVzdGVy
            username: MTIzNDU=
            password: dG9rZW4=
        template: alloy-operator-fleet-management.yaml
        documentSelector: {path: kind, value: Secret}

  - it: points at your Secret and grants access to it
    set:
      cluster: {name: test-cluster}
      alloy-operator:
        fleetManagement:
          enabled: true
          url: "https://fleet.example.com"
          auth: {usernameKey: stack-id, passwordKey: token}
          secret: {create: false, name: fleet-credentials}
    asserts:
      - hasDocuments:
          count: 3
        template: alloy-operator-fleet-management.yaml
      - equal:
          path: data
          value:
            url: aHR0cHM6Ly9mbGVldC5leGFtcGxlLmNvbQ==
            cluster: dGVzdC1jbHVzdGVy
            credentialsSecret: ZmxlZXQtY3JlZGVudGlhbHM=
            usernameKey: c3RhY2staWQ=
            passwordKey: dG9rZW4=
        template: alloy-operator-fleet-management.yaml
        documentSelector: {path: kind, value: Secret}
      - equal:
          path: rules[0].resourceNames
          value: [alloy-operator-fleet-management, fleet-credentials]
        template: alloy-operator-fleet-management.yaml
        documentSelector: {path: kind, value: Role}

  - it: defaults the keys in your Secret
    set:
      cluster: {name: test-cluster}
      alloy-operator:
        fleetManagement: {enabled: true, url: "https://fleet.example.com", secret: {create: false, name: fleet-credentials}}
    asserts:
      - equal:
          path: data
          value:
            url: aHR0cHM6Ly9mbGVldC5leGFtcGxlLmNvbQ==
            cluster: dGVzdC1jbHVzdGVy
            credentialsSecret: ZmxlZXQtY3JlZGVudGlhbHM=
            usernameKey: dXNlcm5hbWU=
            passwordKey: cGFzc3dvcmQ=
        template: alloy-operator-fleet-management.yaml
        documentSelector: {path: kind, value: Secret}

  - it: requires the credentials
    set:
      cluster: {name: test-cluster}
      alloy-operator:
        fleetManagement: {enabled: true, url: "https://fleet.example.com", auth: {username: "12345"}}
    asserts:
      - failedTemplate:
          errorMessage: "alloy-operator.fleetManagement.enabled needs alloy-operator.fleetManagement.auth.username and auth.password, or secret.create: false and secret.name to read them from your Secret."
        template: alloy-operator-fleet-management.yaml

  - it: doesn't take the credentials from the collectors' remote config
    set:
      cluster: {name: test-cluster}
      alloy-operator: {fleetManagement: {enabled: true, url: "https://fleet.example.com"}}
      collectorCommon:
        alloy:
          remoteConfig: {enabled: true, url: "https://fleet.example.com", auth: {username: "12345", password: "token"}}
    asserts:
      - failedTemplate:
          errorMessage: "alloy-operator.fleetManagement.enabled needs alloy-operator.fleetManagement.auth.username and auth.password, or secret.create: false and secret.name to read them from your Secret."
        template: alloy-operator-fleet-management.yaml

  - it: requires the name of your Secret
    set:
      cluster: {name: test-cluster}
      alloy-operator:
        fleetManagement: {enabled: true, url: "https://fleet.example.com", secret: {create: false}}
    asserts:
      - failedTemplate:
          errorMessage: "alloy-operator.fleetManagement.secret.create: false needs alloy-operator.fleetManagement.secret.name, a Secret in the Alloy Operator's namespace."
        template: alloy-operator-fleet-management.yaml

  - it: requires the url
    set:
      cluster: {name: test-cluster}
      alloy-operator:
        fleetManagement: {enabled: true, auth: {username: "12345", password: "token"}}
    asserts:
      - failedTemplate:
          errorMessage: alloy-operator.fleetManagement.url is required for alloy-operator.fleetManagement
        template: alloy-operator-fleet-management.yaml

  - it: requires at least one collector when Fleet Management sync is disabled
    set:
      cluster: {name: test-cluster}
      collectorCommon:
        alloy:
          remoteConfig: {enabled: true, url: "https://fleet.example.com", auth: {username: "12345", password: "token"}}
    asserts:
      - failedTemplate:
          errorPattern: At least one collector should be enabled
        template: validations.yaml
