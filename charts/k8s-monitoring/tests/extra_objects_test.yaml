# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Feature - Extra Objects
templates:
  - extra-objects.yaml
tests:
  - it: creates extra objects
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: my-config
            namespace: my-namespace
          data:
            key: value
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: my-config
          namespace: my-namespace

  - it: creates extra objects from a map
    set:
      extraObjects:
        my-config:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: my-config
            namespace: my-namespace
          data:
            key: value
        my-other-config:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: my-other-config
            namespace: my-namespace
          data:
            key: value
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: my-config
          namespace: my-namespace
        documentIndex: 0
      - containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: my-other-config
          namespace: my-namespace
        documentIndex: 1

  - it: renders map entries in sorted key order
    set:
      extraObjects:
        zebra:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: zebra-config
        alpha:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: alpha-config
        mike:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: mike-config
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: alpha-config
        documentIndex: 0
      - equal:
          path: metadata.name
          value: mike-config
        documentIndex: 1
      - equal:
          path: metadata.name
          value: zebra-config
        documentIndex: 2
