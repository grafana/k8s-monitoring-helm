# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Feature - Windows Event Logs - Structured metadata
templates:
  - test/configmap.yaml
tests:
  - it: should set structured metadata from extracted event fields
    set:
      testing: {enabled: true}
      sources:
        - name: application
          eventLogName: Application
          jobLabel: integrations/windows-application-logs
      structuredMetadata:
        event_id: eventID
        computer: computer
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
