# yamllint disable rule:document-start rule:line-length rule:trailing-spaces rule:empty-lines
suite: Feature - Windows Event Logs - Collector validation
templates:
  - test/configmap.yaml
tests:
  - it: should fail if not a daemonset
    set:
      sources:
        - name: application
          eventLogName: Application
      testing:
        enabled: true
        Collector:
          presets: [windows, windows-host-process]
          controller:
            type: deployment
    asserts:
      - failedTemplate:
          errorMessage: |-
            Windows Event Logs feature requires Alloy to be a DaemonSet, so that an Alloy Pod runs on every Windows Node.
            Please set:
            collectors:
              alloy-test:
                controller:
                  type: daemonset

  - it: should fail without the windows-host-process preset
    set:
      sources:
        - name: application
          eventLogName: Application
      testing:
        enabled: true
        Collector:
          presets: [windows, daemonset]
          controller:
            type: daemonset
    asserts:
      - failedTemplate:
          errorMessage: |-
            Windows Event Logs feature requires Alloy to run on Windows Nodes with host access, so it can read the Node's event logs.
            Please use the `windows` and `windows-host-process` presets:
            collectors:
              alloy-test:
                presets: [windows, windows-host-process, daemonset]

  - it: should fail without the windows preset
    set:
      sources:
        - name: application
          eventLogName: Application
      testing:
        enabled: true
        Collector:
          presets: [windows-host-process, daemonset]
          controller:
            type: daemonset
    asserts:
      - failedTemplate:
          errorMessage: |-
            Windows Event Logs feature requires Alloy to run on Windows Nodes with host access, so it can read the Node's event logs.
            Please use the `windows` and `windows-host-process` presets:
            collectors:
              alloy-test:
                presets: [windows, windows-host-process, daemonset]

  - it: should pass with a windows host-process daemonset collector
    set:
      sources:
        - name: application
          eventLogName: Application
      testing:
        enabled: true
        Collector:
          presets: [windows, windows-host-process, daemonset]
          controller:
            type: daemonset
    asserts:
      - isKind:
          of: ConfigMap
