# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Feature - Integration - PostgreSQL - Database Observability Metrics
templates:
  - test/configmap.yaml
  - postgresql-secret.yaml
tests:
  - it: should create the PostgreSQL config
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: my-database
            exporter:
              dataSource:
                host: my-db.postgresql.svc
                auth:
                  username: db-admin
                  password: db-password
            databaseObservability:
              enabled: true
            logs: {enabled: false}
    asserts:
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

      - template: postgresql-secret.yaml
        documentIndex: 0
        containsDocument:
          apiVersion: v1
          kind: Secret
          name: my-database-release-name-feature-integrations
          namespace: NAMESPACE
      - template: postgresql-secret.yaml
        equal:
          path: stringData.username
          value: db-admin
      - template: postgresql-secret.yaml
        equal:
          path: stringData.password
          value: db-password

  - it: works with multiple PostgreSQL Instances
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: test-db
            exporter:
              dataSource:
                host: database.test.svc
            databaseObservability:
              enabled: true
            logs: {enabled: false}
          - name: staging-db
            exporter:
              dataSourceName: "root:password@database.staging.svc:3306/"
            databaseObservability:
              enabled: true
            logs: {enabled: false}
          - name: prod-db
            exporter:
              dataSource:
                host: database.prod.svc
                auth:
                  username: db-admin
                  password: db-password
            databaseObservability:
              enabled: true
            logs: {enabled: false}
    asserts:
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

      - template: postgresql-secret.yaml
        hasDocuments:
          count: 1  # Only one secret should be created
      - template: postgresql-secret.yaml
        documentIndex: 0
        containsDocument:
          apiVersion: v1
          kind: Secret
          name: prod-db-release-name-feature-integrations
          namespace: NAMESPACE
      - template: postgresql-secret.yaml
        equal:
          path: stringData.username
          value: db-admin
      - template: postgresql-secret.yaml
        equal:
          path: stringData.password
          value: db-password

  - it: renders new db o11y options (azure, exclude_databases, exclude_current_user)
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: azure-db
            exporter:
              dataSource:
                host: azure-db.postgresql.svc
                auth:
                  username: db-admin
                  password: db-password
            databaseObservability:
              enabled: true
              excludeDatabases: ["employees", "departments"]
              cloudProvider:
                azure:
                  subscriptionId: "sub-123"
                  resourceGroup: "rg-prod"
                  serverName: "my-azure-server"
              collectors:
                querySamples:
                  enabled: true
                  collectInterval: 1m
                  disableQueryRedaction: false
                  excludeCurrentUser: false
            logs: {enabled: false}
    asserts:
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

  - it: renders new db o11y options (exclude_users)
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: new-opts-db
            exporter:
              dataSource:
                host: new-opts-db.postgresql.svc
                auth:
                  username: db-admin
                  password: db-password
            databaseObservability:
              enabled: true
              excludeUsers: ["monitoring_user"]
            logs: {enabled: false}
    asserts:
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

  - it: honors top-level exclude_current_user
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: top-level-excl-db
            exporter:
              dataSource:
                host: top-level-excl-db.postgresql.svc
                auth:
                  username: db-admin
                  password: db-password
            databaseObservability:
              enabled: true
              excludeCurrentUser: false
            logs: {enabled: false}
    asserts:
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

  - it: renders new db o11y options (statements_limit)
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: limited-db
            exporter:
              dataSource:
                host: limited-db.postgresql.svc
                auth:
                  username: db-admin
                  password: db-password
            databaseObservability:
              enabled: true
              collectors:
                queryDetails:
                  enabled: true
                  statementsLimit: 50
            logs: {enabled: false}
    asserts:
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

  - it: renders gcp cloud_provider and disable_collectors
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: gcp-db
            exporter:
              dataSource:
                host: gcp-db.postgresql.svc
                auth:
                  username: db-admin
                  password: db-password
            databaseObservability:
              enabled: true
              cloudProvider:
                gcp:
                  connectionName: "my-project:us-central1:my-db"
              collectors:
                explainPlans:
                  enabled: false
                schemaDetails:
                  enabled: false
            logs: {enabled: false}
    asserts:
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

  - it: keeps prometheus.relabel when metrics tuning is set under db o11y
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: my-database
            exporter:
              dataSource:
                host: my-db.postgresql.svc
                auth:
                  username: db-admin
                  password: db-password
            databaseObservability:
              enabled: true
            metrics:
              tuning:
                excludeMetrics: ["pg_stat_activity_.*"]
            logs: {enabled: false}
    asserts:
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

  - it: respects an explicit jobLabel override under db o11y
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: my-database
            jobLabel: my/custom-job
            exporter:
              dataSource:
                host: my-db.postgresql.svc
                auth:
                  username: db-admin
                  password: db-password
            databaseObservability:
              enabled: true
            logs: {enabled: false}
    asserts:
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

  - it: adds custom labels to db o11y metrics and logs
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: my-database
            exporter:
              dataSource:
                host: my-db.postgresql.svc
            databaseObservability:
              enabled: true
              labels:
                environment: production
                team: payments
            logs: {enabled: false}
    asserts:
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

  - it: rejects reserved db o11y labels
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: my-database
            exporter:
              dataSource:
                host: my-db.postgresql.svc
            databaseObservability:
              enabled: true
              labels:
                job: custom
            logs: {enabled: false}
    asserts:
      - template: test/configmap.yaml
        failedTemplate:
          errorMessage: |-
            The label "job" in databaseObservability.labels for instance "my-database" is reserved and cannot be overridden.
            Reserved labels: job, instance, dsn.
            Use `jobLabel` to change the job value.

  - it: requires metrics
    set:
      testing: {enabled: true}
      postgresql:
        instances:
          - name: test-database
            metrics: {enabled: false}
            logs: {enabled: false}
            databaseObservability:
              enabled: true
    asserts:
      - template: test/configmap.yaml
        failedTemplate:
          errorMessage: |-
            Enabling Database Observability for PostgreSQL requires exporter metrics.
            Please set:
            integrations:
              postgresql:
                instances:
                  - name: test-database
                    metrics:
                      enabled: true

  - it: renders a file source inside the module and enables error processing
    set:
      testing:
        enabled: true
      postgresql:
        instances:
          - name: logs-db
            exporter:
              dataSource:
                host: localhost
                database: postgres
            logs:
              enabled: false
            databaseObservability:
              enabled: true
              collectors:
                logs:
                  enabled: true
              logSource:
                type: file
                file:
                  paths:
                    - /var/log/postgresql/*.log
    asserts:
      - template: test/configmap.yaml
        matchRegex:
          path: data["metrics.alloy"]
          pattern: enable_collectors = \[.*"logs".*\]
      - template: test/configmap.yaml
        matchRegex:
          path: data["metrics.alloy"]
          pattern: enable_error_logs_processing = true
      - template: test/configmap.yaml
        matchRegex:
          path: data["metrics.alloy"]
          pattern: (?s)declare "postgresql_integration" \{\n(?:[ \t][^\n]*\n|\n)*  loki.source.file "database_observability_postgres_logs_db" \{.*forward_to = \[database_observability.postgres.logs_db.logs_receiver\].*\n\}
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

  - it: renders CloudWatch and the Loki exporter inside the module without an ARN
    set:
      testing:
        enabled: true
      postgresql:
        instances:
          - name: logs-db
            exporter:
              dataSource:
                host: localhost
                database: postgres
            logs:
              enabled: false
            databaseObservability:
              enabled: true
              collectors:
                logs:
                  enabled: true
              logSource:
                type: cloudwatch
                file:
                  paths:
                    - /var/log/postgresql/*.log
                cloudwatch:
                  region: eu-west-1
                  groupName: /aws/rds/instance/example-db/postgresql
                  profile: monitoring
                  imdsEndpoint: http://localhost:1338
                  pollInterval: 30s
                  initialLookback: 5m
                  maxEventsPerRequest: 500
                  startFrom: '2026-09-01T00:00:00Z'
    asserts:
      - template: test/configmap.yaml
        matchRegex:
          path: data["metrics.alloy"]
          pattern: enable_collectors = \[.*"logs".*\]
      - template: test/configmap.yaml
        matchRegex:
          path: data["metrics.alloy"]
          pattern: (?s)declare "postgresql_integration" \{\n(?:[ \t][^\n]*\n|\n)*  otelcol.receiver.awscloudwatch "database_observability_postgres_logs_db" \{.*group_name = "/aws/rds/instance/example-db/postgresql".*logs = \[otelcol.exporter.loki.database_observability_postgres_logs_db.input\].*\n  otelcol.exporter.loki "database_observability_postgres_logs_db" \{.*forward_to = \[database_observability.postgres.logs_db.logs_receiver\].*\n\}
      - template: test/configmap.yaml
        matchRegex:
          path: data["metrics.alloy"]
          pattern: 'otelcol.processor.attributes[^}]*key = "loki.format"[^}]*value = "raw"'
      - template: test/configmap.yaml
        matchRegex:
          path: data["metrics.alloy"]
          pattern: 'storage = otelcol.storage.file.database_observability_postgres_logs_db.handler'
      - template: test/configmap.yaml
        matchSnapshot:
          path: data["metrics.alloy"]

  - it: does not render error processing without a source even when enabled
    set:
      testing:
        enabled: true
      postgresql:
        instances:
          - name: logs-db
            exporter:
              dataSource:
                host: localhost
                database: postgres
            logs:
              enabled: false
            databaseObservability:
              enabled: true
              collectors:
                logs:
                  enabled: true
              logSource:
                type: ''
                file:
                  paths:
                    - /var/log/postgresql/*.log
    asserts:
      - template: test/configmap.yaml
        notMatchRegex:
          path: data["metrics.alloy"]
          pattern: enable_error_logs_processing|loki.source.file|otelcol.receiver.awscloudwatch|"logs"

  - it: does not render a configured source when the logs collector is disabled
    set:
      testing:
        enabled: true
      postgresql:
        instances:
          - name: logs-db
            exporter:
              dataSource:
                host: localhost
                database: postgres
            logs:
              enabled: false
            databaseObservability:
              enabled: true
              collectors:
                logs:
                  enabled: false
              logSource:
                type: file
                file:
                  paths:
                    - /var/log/postgresql/*.log
    asserts:
      - template: test/configmap.yaml
        notMatchRegex:
          path: data["metrics.alloy"]
          pattern: enable_error_logs_processing|loki.source.file|otelcol.receiver.awscloudwatch|"logs"

  - it: renders optional wait event and health check settings
    set:
      testing:
        enabled: true
      postgresql:
        instances:
          - name: logs-db
            exporter:
              dataSource:
                host: localhost
                database: postgres
            logs:
              enabled: false
            databaseObservability:
              enabled: true
              collectors:
                logs:
                  enabled: true
                querySamples:
                  enablePreClassifiedWaitEvents: true
              logSource:
                type: file
                file:
                  paths:
                    - /var/log/postgresql/*.log
              healthCheck:
                collectInterval: 30m
    asserts:
      - template: test/configmap.yaml
        matchRegex:
          path: data["metrics.alloy"]
          pattern: enable_pre_classified_wait_events = true
      - template: test/configmap.yaml
        matchRegex:
          path: data["metrics.alloy"]
          pattern: health_check \{\s+collect_interval = "30m"

  - it: rejects a file source without paths
    set:
      testing:
        enabled: true
      postgresql:
        instances:
          - name: logs-db
            exporter:
              dataSource:
                host: localhost
                database: postgres
            logs:
              enabled: false
            databaseObservability:
              enabled: true
              collectors:
                logs:
                  enabled: true
              logSource:
                type: file
                file:
                  paths: []
    asserts:
      - template: test/configmap.yaml
        failedTemplate:
          errorMessage: 'PostgreSQL instance "logs-db": set databaseObservability.logSource.file.paths to at least one readable PostgreSQL log path.'

  - it: rejects a CloudWatch source without its required settings
    set:
      testing:
        enabled: true
      postgresql:
        instances:
          - name: logs-db
            exporter:
              dataSource:
                host: localhost
                database: postgres
            logs:
              enabled: false
            databaseObservability:
              enabled: true
              collectors:
                logs:
                  enabled: true
              logSource:
                type: cloudwatch
                file:
                  paths:
                    - /var/log/postgresql/*.log
    asserts:
      - template: test/configmap.yaml
        failedTemplate:
          errorMessage: 'PostgreSQL instance "logs-db": set databaseObservability.logSource.cloudwatch.region and groupName.'

  - it: rejects an unsupported source type
    set:
      testing:
        enabled: true
      postgresql:
        instances:
          - name: logs-db
            exporter:
              dataSource:
                host: localhost
                database: postgres
            logs:
              enabled: false
            databaseObservability:
              enabled: true
              collectors:
                logs:
                  enabled: true
              logSource:
                type: azure
                file:
                  paths:
                    - /var/log/postgresql/*.log
    asserts:
      - template: test/configmap.yaml
        failedTemplate:
          errorMessage: 'PostgreSQL instance "logs-db": set databaseObservability.logSource.type to file or cloudwatch, or leave it empty to disable the source.'
