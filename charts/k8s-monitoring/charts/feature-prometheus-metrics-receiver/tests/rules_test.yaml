# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Feature - Prometheus Metrics Receiver - Relabeling rules
templates:
  - test/configmap.yaml
tests:
  - it: should render the correct configuration
    set:
      testing: {enabled: true}
      metricProcessingRules: |
        // This creates a consistent hash value (0 or 1) for each unique combination of labels
        // Using multiple source labels provides better sampling distribution across your metrics
        rule {
          source_labels = ["env"]
          target_label = "__tmp_hash"
          action = "hashmod"
          modulus = 2
        }

        // This effectively samples ~50% of metric series
        // The same combination of source label values will always hash to the same number,
        // ensuring consistent sampling
        rule {
          source_labels = ["__tmp_hash"]
          action       = "drop"
          regex        = "^1$"
        }
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
