# yamllint disable rule:document-start rule:line-length rule:trailing-spaces rule:empty-lines
suite: Feature - Pod Logs via Loki - Default Values
templates:
  - test/configmap.yaml
tests:
  - it: should render the default configuration
    set:
      testing: {enabled: true}
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should configure truncation only in the CRI stage
    set:
      testing: {enabled: true}
      defaultLogFormat: docker
      cri:
        maxPartialLineSize: 131072
        maxPartialLineSizeTruncate: true
    asserts:
      - matchRegex:
          path: data["module.alloy"]
          pattern: 'stage\.cri \{\s*max_partial_lines = 100\s*max_partial_line_size = 131072\s*max_partial_line_size_truncate = true\s*\}'
      - matchRegex:
          path: data["module.alloy"]
          pattern: 'stage\.docker \{\}'
  - it: should leave truncation off when only the CRI size is set
    set:
      testing: {enabled: true}
      cri.maxPartialLineSize: 131072
    asserts:
      - matchRegex:
          path: data["module.alloy"]
          pattern: 'max_partial_line_size = 131072'
      - notMatchRegex:
          path: data["module.alloy"]
          pattern: 'max_partial_line_size_truncate'
  - it: should reject CRI truncation without a size
    set:
      testing: {enabled: true}
      cri.maxPartialLineSizeTruncate: true
    asserts:
      - failedTemplate:
          errorMessage: Set podLogsViaLoki.cri.maxPartialLineSize to a positive number of bytes when podLogsViaLoki.cri.maxPartialLineSizeTruncate is true.
  - it: should reject CRI truncation with a zero size
    set:
      testing: {enabled: true}
      cri:
        maxPartialLineSize: 0
        maxPartialLineSizeTruncate: true
    asserts:
      - failedTemplate:
          errorMessage: Set podLogsViaLoki.cri.maxPartialLineSize to a positive number of bytes when podLogsViaLoki.cri.maxPartialLineSizeTruncate is true.
  - it: should allow setting structured metadata
    set:
      testing: {enabled: true}
      structuredMetadata:
        caller: caller
        component: component
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow setting static labels
    set:
      testing: {enabled: true}
      staticLabels:
        region: central
      staticLabelsFrom:
        color: sys.env("COLOR")
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow using the secret filter
    set:
      testing: {enabled: true}
      secretFilter:
        enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow using the secret filter with an allowlist
    set:
      testing: {enabled: true}
      secretFilter:
        enabled: true
        allowlist:
          - ".*secret.*"
          - ".*token.*"
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow using the secret filter with a gitleaks config and other settings
    set:
      testing: {enabled: true}
      secretFilter:
        enabled: true
        gitleaksConfigPath: "/var/log/gitleaks.toml"
        redactWith: "<ALLOY-REDACTED-SECRET:$SECRET_NAME:$SECRET_HASH>"
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow using the secret filter with an inclusion filter, to split which logs are filtered
    set:
      testing: {enabled: true}
      secretFilter:
        enabled: true
        inclusionSelector: '{app=="payment-processor"}'
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]

  - it: should allow using label selectors
    set:
      testing: {enabled: true}
      labelSelectors:
        app: myapp
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow using label selectors with multiple values
    set:
      testing: {enabled: true}
      labelSelectors:
        color: [blue, green]
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
