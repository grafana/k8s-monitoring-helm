# yamllint disable rule:document-start rule:line-length rule:trailing-spaces rule:empty-lines
suite: Feature - Pod Logs via Loki - Default Values
templates:
  - test/configmap.yaml
tests:
  - it: should render the default configuration
    set:
      testing: {enabled: true}
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow setting structured metadata
    set:
      testing: {enabled: true}
      structuredMetadata:
        caller: caller
        component: component
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow setting static labels
    set:
      testing: {enabled: true}
      staticLabels:
        region: central
      staticLabelsFrom:
        color: sys.env("COLOR")
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow using the secret filter
    set:
      testing: {enabled: true}
      secretFilter:
        enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow using the secret filter with an allowlist
    set:
      testing: {enabled: true}
      secretFilter:
        enabled: true
        allowlist:
          - ".*secret.*"
          - ".*token.*"
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow using the secret filter with a gitleaks config and other settings
    set:
      testing: {enabled: true}
      secretFilter:
        enabled: true
        gitleaksConfigPath: "/var/log/gitleaks.toml"
        redactWith: "<ALLOY-REDACTED-SECRET:$SECRET_NAME:$SECRET_HASH>"
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow using the secret filter with an inclusion filter, to split which logs are filtered
    set:
      testing: {enabled: true}
      secretFilter:
        enabled: true
        inclusionSelector: '{app=="payment-processor"}'
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]

  - it: should allow using label selectors
    set:
      testing: {enabled: true}
      labelSelectors:
        app: myapp
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
  - it: should allow using label selectors with multiple values
    set:
      testing: {enabled: true}
      labelSelectors:
        color: [blue, green]
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]

  - it: should filter to namespaces matching a regular expression
    set:
      testing: {enabled: true}
      namespaces: ["team-.*"]
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["module.alloy"]
          pattern: 'rule \{\s*source_labels = \["namespace"\]\s*regex = "team-\.\*"\s*action = "keep"\s*\}'
      - notMatchRegex:
          path: data["module.alloy"]
          pattern: 'namespaces \{'
      - matchSnapshot:
          path: data["module.alloy"]

  - it: should allow multiple namespace patterns, matched as alternation
    set:
      testing: {enabled: true}
      namespaces: ["team-a", "team-b.*"]
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["module.alloy"]
          pattern: 'rule \{\s*source_labels = \["namespace"\]\s*regex = "team-a\|team-b\.\*"\s*action = "keep"\s*\}'
      - matchSnapshot:
          path: data["module.alloy"]

  - it: should exclude namespaces matching a regular expression
    set:
      testing: {enabled: true}
      excludeNamespaces: ["kube-.*"]
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["module.alloy"]
          pattern: 'rule \{\s*source_labels = \["namespace"\]\s*regex = "kube-\.\*"\s*action = "drop"\s*\}'
      - matchSnapshot:
          path: data["module.alloy"]
