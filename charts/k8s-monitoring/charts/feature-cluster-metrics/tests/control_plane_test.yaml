# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Feature - Cluster Metrics - Control Plane Monitoring
templates:
  - test/configmap.yaml
tests:
  - it: should render the configuration with control plane components included
    set:
      testing: {enabled: true}
      controlPlane:
        enabled: true
      kube-state-metrics:
        enabled: false
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]

  - it: should scrape the EKS Control Plane metrics and resource metrics endpoints when discoveryMode is eks-proxy
    set:
      testing: {enabled: true}
      kubeScheduler:
        enabled: true
        discoveryMode: eks-proxy
      kube-state-metrics:
        enabled: false
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["module.alloy"]
          pattern: '/apis/metrics\.eks\.amazonaws\.com/v1/ksh/container/metrics'
      - matchRegex:
          path: data["module.alloy"]
          pattern: '/apis/metrics\.eks\.amazonaws\.com/v1/ksh/container/resourcemetrics'
      - matchSnapshot:
          path: data["module.alloy"]

  - it: should scrape the EKS Control Plane Metrics API when discoveryMode is eks-proxy
    set:
      testing: {enabled: true}
      kubeScheduler:
        enabled: true
        discoveryMode: eks-proxy
      kubeControllerManager:
        enabled: true
        discoveryMode: eks-proxy
      kube-state-metrics:
        enabled: false
    asserts:
      - isKind:
          of: ConfigMap
      # eks-proxy mode targets the API server directly, not a Pod discovered in kube-system.
      - notMatchRegex:
          path: data["module.alloy"]
          pattern: 'discovery\.kubernetes "kube_scheduler"'
      - notMatchRegex:
          path: data["module.alloy"]
          pattern: 'discovery\.kubernetes "kube_controller_manager"'
      - matchRegex:
          path: data["module.alloy"]
          pattern: '/apis/metrics\.eks\.amazonaws\.com/v1/ksh/container/metrics'
      - matchRegex:
          path: data["module.alloy"]
          pattern: '/apis/metrics\.eks\.amazonaws\.com/v1/ksh/container/resourcemetrics'
      - matchRegex:
          path: data["module.alloy"]
          pattern: '/apis/metrics\.eks\.amazonaws\.com/v1/kcm/container/metrics'
      - matchSnapshot:
          path: data["module.alloy"]
