# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Feature - Prometheus Operator Objects - Native Histogram Scraping
templates:
  - test/configmap.yaml
tests:
  - it: emits scrape_native_histograms but not scrape_protocols when scrapeNativeHistograms is enabled
    set:
      testing: {enabled: true}
      global:
        scrapeNativeHistograms: true
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["module.alloy"]
          pattern: scrape_native_histograms = true
      # scrape_protocols is not a valid argument on the prometheus.operator.* components in Alloy
      # (only on prometheus.scrape), so the chart must never render it inside their `scrape { }` block,
      # even when scrapeNativeHistograms is on.
      - notMatchRegex:
          path: data["module.alloy"]
          pattern: scrape_protocols =

  - it: does not emit scrape_protocols when scrapeNativeHistograms is disabled
    set:
      testing: {enabled: true}
    asserts:
      - isKind:
          of: ConfigMap
      - notMatchRegex:
          path: data["module.alloy"]
          pattern: scrape_protocols =

  - it: emits all histogram scrape options when configured
    set:
      testing: {enabled: true}
      global:
        scrapeClassicHistograms: true
        scrapeNativeHistograms: true
        convertClassicHistogramsToNhcb: true
        nativeHistogramBucketLimit: 100
        nativeHistogramMinBucketFactor: 1.1
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["module.alloy"]
          pattern: scrape_classic_histograms = true
      - matchRegex:
          path: data["module.alloy"]
          pattern: scrape_native_histograms = true
      - matchRegex:
          path: data["module.alloy"]
          pattern: convert_classic_histograms_to_nhcb = true
      - matchRegex:
          path: data["module.alloy"]
          pattern: native_histogram_bucket_limit = 100
      - matchRegex:
          path: data["module.alloy"]
          pattern: native_histogram_min_bucket_factor = 1\.1

  - it: renders a large nativeHistogramBucketLimit without truncating it to zero
    # Large numbers are parsed as float64 by Helm and stringify to scientific
    # notation (e.g. "1e+06"); the template must coerce through float64 before int
    # so the value survives instead of silently rendering as 0.
    set:
      testing: {enabled: true}
      global:
        scrapeNativeHistograms: true
        nativeHistogramBucketLimit: 1000000
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["module.alloy"]
          pattern: native_histogram_bucket_limit = 1000000
      - notMatchRegex:
          path: data["module.alloy"]
          pattern: native_histogram_bucket_limit = 0

  - it: honors a large per-feature nativeHistogramBucketLimit override
    set:
      testing: {enabled: true}
      global:
        nativeHistogramBucketLimit: 100
      nativeHistogramBucketLimit: 2000000
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["module.alloy"]
          pattern: native_histogram_bucket_limit = 2000000

  - it: disables histogram bucket merging options by default
    set:
      testing: {enabled: true}
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["module.alloy"]
          pattern: scrape_classic_histograms = false
      - matchRegex:
          path: data["module.alloy"]
          pattern: convert_classic_histograms_to_nhcb = false
      - matchRegex:
          path: data["module.alloy"]
          pattern: native_histogram_bucket_limit = 0
      - matchRegex:
          path: data["module.alloy"]
          pattern: native_histogram_min_bucket_factor = 0
