# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Feature - Application Observability - Resource detection processor
templates:
  - test/configmap.yaml
tests:
  - it: creates the pipeline with the default resource detection processor
    set:
      testing: {enabled: true}
      receivers:
        zipkin:
          enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]

  - it: bypasses resource detection for every receiver when disabled
    set:
      testing: {enabled: true}
      processors:
        resourceDetection:
          enabled: false
      receivers:
        otlp:
          grpc:
            enabled: true
        jaeger:
          grpc:
            enabled: true
        zipkin:
          enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - notMatchRegex:
          path: data["module.alloy"]
          pattern: otelcol\.processor\.resourcedetection
      - matchSnapshot:
          path: data["module.alloy"]

  - it: bypasses resource detection when every detector is disabled
    set:
      testing: {enabled: true}
      processors:
        resourceDetection:
          env:
            enabled: false
          system:
            enabled: false
          kubernetesNode:
            enabled: false
      receivers:
        otlp:
          grpc:
            enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - notMatchRegex:
          path: data["module.alloy"]
          pattern: otelcol\.processor\.resourcedetection
      - matchSnapshot:
          path: data["module.alloy"]

  - it: routes the memory limiter directly to Kubernetes attributes when resource detection is disabled
    set:
      testing: {enabled: true}
      processors:
        memoryLimiter:
          enabled: true
        resourceDetection:
          enabled: false
      receivers:
        otlp:
          grpc:
            enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - notMatchRegex:
          path: data["module.alloy"]
          pattern: otelcol\.processor\.resourcedetection
      - matchSnapshot:
          path: data["module.alloy"]

  - it: creates the resource detection processor with Kubernetes node info
    set:
      testing: {enabled: true}
      processors:
        resourceDetection:
          kubernetesNode:
            enabled: true
      receivers:
        zipkin:
          enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]

  - it: creates the resource detection processor with EKS info
    set:
      testing: {enabled: true}
      processors:
        resourceDetection:
          override: false
          eks:
            enabled: true
            resourceAttributes:
              k8s.cluster.name:
                enabled: true
      receivers:
        zipkin:
          enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - matchSnapshot:
          path: data["module.alloy"]
