---
# Verified against Alloy v1.20.0.
# Alloy components that use the Kubernetes API, and the rbac-bundles.yaml bundles they need. See docs/RBAC.md.
#
# A block is one use of a component in a collector's Alloy config, like `discovery.kubernetes "pods" { ... }`.
# A component can have several entries. For each block of the component, the scanner grants the bundles of every entry
# that matches that block. For example, discovery.kubernetes's first entry grants its role's resources, and the
# attach_metadata entries add nodes or namespaces on top.
#
# Fields:
#   component:     The Alloy component name, like discovery.kubernetes. Required.
#   match:          A regular expression run against the Alloy config text inside the block's braces, nested blocks
#                   included and comments removed. The entry applies only if it matches. A list of regular expressions
#                   must all match. Default: every block.
#   unless:         A regular expression like match. The entry doesn't apply if it matches. Default: none.
#   bundles:        Bundles to grant, limited to the namespaces that scope or namespaces give.
#   roles:          A map from the block's role attribute to bundles, used instead of bundles. A role that isn't a string
#                   literal, or isn't in the map, gets every role's bundles, cluster-wide.
#   scope:          Where the block limits its namespaces. namespacesBlock reads names and own_namespace from a
#                   namespaces block, namespacesAttribute reads a namespaces list attribute, filterNamespace reads the
#                   namespace attribute of a filter block, kubernetesService reads the namespace from a resolver's
#                   kubernetes service ("<service>.<namespace>", or the release namespace without one), ownNamespace
#                   is the release namespace, and targets uses the namespaces of the discovery.kubernetes blocks that
#                   the block's targets come from. Default: cluster-wide.
#   namespaces:     A fixed list of namespaces for bundles, used instead of scope.
#   clusterBundles: Bundles to always grant cluster-wide.
#   namedObject:    A bundle to grant only for the object that the block's name and namespace attributes name. Entries
#                   with namedObject ignore every other field.
#   targets:        For components that send the ServiceAccount token, a list of {match, bundles}. Each source of the
#                   block's targets gets the bundles of the first item whose match fits the text on the way from the
#                   source to the block. An item without match fits every source. A source that no item fits, or that
#                   can't be followed, fails the render.
- component: discovery.kubernetes
  scope: namespacesBlock
  roles:
    pod: [pods]
    service: [services]
    endpoints: [endpoints]
    endpointslice: [endpointslices]
    ingress: [ingresses]
    node: [nodes]
- component: discovery.kubernetes
  match: 'attach_metadata\s*\{[^{}]*\bnode\s*='
  bundles: [nodes]
- component: discovery.kubernetes
  match: 'attach_metadata\s*\{[^{}]*\bnamespace\s*='
  bundles: [namespaces]
- component: discovery.kubelet
  bundles: [kubeletPods]
- component: loki.source.kubernetes
  scope: targets
  bundles: [podLogs]
- component: loki.source.kubernetes_events
  scope: namespacesAttribute
  bundles: [events]
- component: loki.source.podlogs
  bundles: [podLogsObjects]
- component: prometheus.operator.podmonitors
  scope: namespacesAttribute
  bundles: [promOperator.podmonitors, promOperatorCredentials]
  clusterBundles: [pods, nodes]
- component: prometheus.operator.servicemonitors
  scope: namespacesAttribute
  bundles: [promOperator.servicemonitors, promOperatorCredentials]
  clusterBundles: [nodes]
- component: prometheus.operator.servicemonitors
  match: 'kubernetes_role\s*='
  unless: 'kubernetes_role\s*=\s*"endpoints"'
  clusterBundles: [endpointslices]
- component: prometheus.operator.servicemonitors
  unless: 'kubernetes_role\s*=\s*"endpointslice"'
  clusterBundles: [endpoints]
- component: prometheus.operator.probes
  scope: namespacesAttribute
  bundles: [promOperator.probes, promOperatorCredentials]
  clusterBundles: [ingresses]
- component: prometheus.operator.scrapeconfigs
  scope: namespacesAttribute
  bundles: [promOperator.scrapeconfigs, promOperatorCredentials]
- component: mimir.rules.kubernetes
  bundles: [prometheusRules]
- component: loki.rules.kubernetes
  bundles: [prometheusRules]
- component: mimir.alerts.kubernetes
  bundles: [alertmanagerConfigs]
- component: remote.kubernetes.secret
  namedObject: secret
- component: remote.kubernetes.configmap
  namedObject: configMap
- component: otelcol.processor.k8sattributes
  scope: filterNamespace
  unless: 'passthrough\s*=\s*true'
  bundles: [pods]
- component: otelcol.processor.k8sattributes
  unless: 'passthrough\s*=\s*true'
  match: 'from\s*=\s*"namespace"'
  bundles: [namespaces]
- component: otelcol.processor.k8sattributes
  unless: 'passthrough\s*=\s*true'
  match: 'k8s\.cluster\.uid'
  bundles: [kubeSystemNamespace]
- component: otelcol.processor.k8sattributes
  unless: 'passthrough\s*=\s*true'
  match: 'from\s*=\s*"node"|k8s\.node\.uid'
  bundles: [nodes]
- component: otelcol.processor.k8sattributes
  unless: 'passthrough\s*=\s*true'
  scope: filterNamespace
  match: 'k8s\.deployment\.uid|from\s*=\s*"(deployment|replicaset)"'
  bundles: [replicasets]
- component: otelcol.processor.k8sattributes
  unless: 'passthrough\s*=\s*true'
  scope: filterNamespace
  match: 'from\s*=\s*"deployment"'
  bundles: [deployments]
- component: otelcol.processor.k8sattributes
  unless: 'passthrough\s*=\s*true'
  scope: filterNamespace
  match: 'from\s*=\s*"statefulset"'
  bundles: [statefulsets]
- component: otelcol.processor.k8sattributes
  unless: 'passthrough\s*=\s*true'
  scope: filterNamespace
  match: 'from\s*=\s*"daemonset"'
  bundles: [daemonsets]
- component: otelcol.processor.k8sattributes
  unless: 'passthrough\s*=\s*true'
  scope: filterNamespace
  match: 'k8s\.cronjob\.uid|from\s*=\s*"(job|cronjob)"'
  bundles: [jobs]
- component: otelcol.processor.k8sattributes
  unless: 'passthrough\s*=\s*true'
  scope: filterNamespace
  match: 'from\s*=\s*"cronjob"'
  bundles: [cronjobs]
- component: otelcol.processor.resourcedetection
  match: ['detectors\s*=\s*\[[^\]]*"kubernetes_node"', 'kubernetes_node\s*\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\bauth_type\s*=\s*"serviceAccount"']
  bundles: [nodeGet]
- component: otelcol.processor.resourcedetection
  match: ['detectors\s*=\s*\[[^\]]*"kubeadm"', 'kubeadm\s*\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\bauth_type\s*=\s*"serviceAccount"']
  bundles: [kubeadmConfig]
  namespaces: [kube-system]
- component: otelcol.processor.resourcedetection
  match: 'detectors\s*=\s*\[[^\]]*"openshift"'
  unless: 'openshift\s*\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\btoken\s*='
  bundles: [openshiftInfrastructures]
- component: otelcol.processor.resourcedetection
  match: 'detectors\s*=\s*\[[^\]]*"eks"'
  bundles: [nodeGet]
- component: otelcol.exporter.loadbalancing
  scope: kubernetesService
  match: 'resolver\s*\{\s*kubernetes\s*\{'
  bundles: [loadBalancer]
- component: beyla.ebpf
  bundles: [pods, services, nodes]
- component: beyla.ebpf
  scope: ownNamespace
  match: 'external_deployment_name\s*='
  bundles: [pods, configMapWriter]
- component: prometheus.scrape
  match: '/var/run/secrets/kubernetes\.io/serviceaccount/token'
  targets:
    - {match: '/api/v1/nodes/[^"]*/proxy/', bundles: [kubeletProxy]}
    - {match: '/apis/metrics\.eks\.amazonaws\.com/v1/kcm/', bundles: [eksKubeControllerManagerMetrics]}
    - {match: '/apis/metrics\.eks\.amazonaws\.com/v1/ksh/', bundles: [eksKubeSchedulerMetrics]}
    - {match: 'role\s*=\s*"node"', bundles: [kubeletMetrics]}
    - {bundles: [metricsEndpoint]}
- component: pyroscope.scrape
  match: '/var/run/secrets/kubernetes\.io/serviceaccount/token'
  targets:
    - {match: 'role\s*=\s*"(pod|service|endpoints|endpointslice)"', bundles: []}
- component: otelcol.auth.oauth2
  match: '/var/run/secrets/kubernetes\.io/serviceaccount/token'
