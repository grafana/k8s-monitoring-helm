---
# Do not edit this file. It is generated by the Makefile.
# The default ClusterRole rules of the Alloy Helm chart 1.13.0 (Alloy v1.20.0), which Alloy Operator 0.8.0 embeds.
# The chart does not read this file. When an Alloy update changes these rules, review the rbac.mode: minimal
# catalogs, collectors/alloy-kubernetes-api.yaml and collectors/rbac-bundles.yaml.
rules:
  - apiGroups: ["", discovery.k8s.io, networking.k8s.io]
    resources: [endpoints, endpointslices, ingresses, pods, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/log, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.grafana.com]
    resources: [podlogs]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [alertmanagerconfigs]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [podmonitors, servicemonitors, probes, scrapeconfigs]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list, watch]
  - apiGroups: [apps, extensions]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
