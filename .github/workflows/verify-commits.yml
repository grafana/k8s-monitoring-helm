---
name: Verify Commits
# yamllint disable-line rule:truthy
on:
  pull_request:

permissions: {}

jobs:
  verify-commits:
    name: Verify commit signatures
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check that all commits are verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          unverified="$(gh api \
            --paginate \
            "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | select(.commit.verification.verified == false) | "\(.sha[0:8]) \(.commit.verification.reason): \(.commit.message | split("\n")[0])"')"

          if [ -n "${unverified}" ]; then
            echo "::error::This PR contains unverified commits. All commits must be signed and verified before merging."
            echo ""
            echo "Unverified commits:"
            echo "${unverified}" | while IFS= read -r line; do
              echo "  - ${line}"
            done
            echo ""
            echo "See https://docs.github.com/en/authentication/managing-commit-signature-verification for how to sign your commits."
            exit 1
          fi

          echo "All commits are verified. ✅"
