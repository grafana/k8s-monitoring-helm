---
name: Unit Test
# yamllint disable-line rule:truthy
on:
  push:
    branches: ["main", "2.0-stable"]
    paths:
      - 'charts/**'
      - '!charts/k8s-monitoring-v1/**'
  pull_request:
    paths:
      - 'charts/**'
      - '!charts/k8s-monitoring-v1/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: {}

jobs:
  detect-changed-charts:
    name: Detect Changed Charts
    runs-on: ubuntu-latest
    outputs:
      changed_charts: ${{ steps.changed_charts.outputs.changed_charts }}
      test_charts: ${{ steps.test_charts.outputs.test_charts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: 'false'

      - name: Detect Changed Charts
        id: changed_charts
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # In pull request, compare against the base branch (upstream)
            echo "Comparing against base branch: ${BASE_BRANCH}"
            git fetch origin "${BASE_BRANCH}"
            base_commit="origin/${BASE_BRANCH}"
          elif [ "${{ github.event_name }}" == "push" ]; then
            # In push to main, compare the last commit with HEAD^
            base_commit="HEAD^"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # In manual trigger, run for all charts
            echo "Manual dispatch detected, running tests for all charts"
            # shellcheck disable=SC2010
            changed_charts=$(ls charts | grep -v "k8s-monitoring-v1" | sort -u)
            echo "changed_charts=$(echo "$changed_charts" | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Check if base commit exists, fallback to empty tree if none
          if ! git rev-parse --verify "$base_commit" >/dev/null 2>&1; then
            base_commit=$(git hash-object -t tree /dev/null)
          fi

          # Detect modified files
          modified_charts=$(git diff --name-only "$base_commit" HEAD -- 'charts/*' | grep "^charts/" | cut -d "/" -f2 | sort -u)

          # Detect newly added files (untracked files)
          added_charts=$(git ls-files --others --exclude-standard -- 'charts/*' | grep "^charts/" | cut -d "/" -f2 | sort -u)

          # Combine both added and modified charts
          changed_charts=$(echo -e "$modified_charts\n$added_charts" | grep -v "k8s-monitoring-v1" | sort -u)

          if [ -z "$changed_charts" ]; then
            echo "No changes detected in charts"
          else
            echo "Changed charts: $changed_charts"
            echo "changed_charts=$(echo "$changed_charts" | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')" >> "${GITHUB_OUTPUT}"
          fi

      - name: Expand test matrix
        id: test_charts
        env:
          CHANGED: ${{ steps.changed_charts.outputs.changed_charts }}
        run: |
          test_charts=$(echo "${CHANGED:-[]}" | jq -r '.[]' | while IFS= read -r chart; do
            echo "charts/${chart}"
            if [ "$chart" == "k8s-monitoring" ]; then
              find "charts/${chart}/charts" -mindepth 2 -maxdepth 2 -name Chart.yaml -exec dirname {} \;
            fi
          done | sort -u | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')
          echo "test_charts=${test_charts}" >> "${GITHUB_OUTPUT}"

  run-tests:
    name: Testing
    needs: detect-changed-charts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: ${{ fromJson(needs.detect-changed-charts.outputs.test_charts) }}
      fail-fast: false
    if: ${{ needs.detect-changed-charts.outputs.test_charts != 'none' }}
    env:
      ALLOY_VERSION: v1.17.1
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: 'false'

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v4.1.4  # pin to 4.1.x; 4.2.x changes template output formatting (helm/helm#32132)

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0

      # Grafana Alloy is needed to lint the generated alloy config files.
      - name: Cache Grafana Alloy
        if: matrix.dir == 'charts/k8s-monitoring'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.alloy
          key: alloy-${{ env.ALLOY_VERSION }}-linux-amd64

      - name: Set up Grafana Alloy
        if: matrix.dir == 'charts/k8s-monitoring'
        run: |
          if [ ! -x "${HOME}/.alloy/alloy" ]; then
            mkdir -p "${HOME}/.alloy"
            curl -fsSL -o /tmp/alloy.zip "https://github.com/grafana/alloy/releases/download/${ALLOY_VERSION}/alloy-linux-amd64.zip"
            unzip -o /tmp/alloy.zip -d /tmp/alloy
            install -m 0755 /tmp/alloy/alloy-linux-amd64 "${HOME}/.alloy/alloy"
          fi
          echo "${HOME}/.alloy" >> "${GITHUB_PATH}"

      - name: Run tests
        env:
          DIR: ${{ matrix.dir }}
        run: |
          if [ "${DIR}" == "charts/k8s-monitoring" ]; then
            make -C "${DIR}" test-self
          else
            make -C "${DIR}" test
          fi

  check-generated-files:
    name: Check Generated Files
    needs: detect-changed-charts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: ${{ fromJson(needs.detect-changed-charts.outputs.changed_charts) }}
      fail-fast: false
    if: ${{ needs.detect-changed-charts.outputs.changed_charts != 'none' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: 'false'

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v4.1.4  # pin to 4.1.x; 4.2.x changes template output formatting (helm/helm#32132)

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Regenerate files
        env:
          CHART: ${{ matrix.dir }}
        run: make -C "charts/${CHART}" clean build

      - name: Check for changes in generated files
        env:
          CHART: ${{ matrix.dir }}
        run: |
          cd "charts/${CHART}"
          if [ "${CHART}" == "k8s-monitoring" ]; then
            # Skip checking subchart files for k8s-monitoring, which are always modified, even if the contents are identical
            if ! git diff --exit-code -- ':!charts/*.tgz'; then
              echo "Generated files in charts/${CHART} are not up to date. Please run 'make build' and commit the changes."
              exit 1
            fi
          elif ! git diff --exit-code .; then
            echo "Generated files in charts/${CHART} are not up to date. Please run 'make build' and commit the changes."
            exit 1
          else
            echo "Generated files in charts/${CHART} are up to date."
          fi
